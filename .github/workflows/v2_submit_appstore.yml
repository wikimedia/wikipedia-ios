name: V2 Submit App Store

# This workflow does not build or upload anything. It takes a version and
# build number that the Beta workflow already uploaded to TestFlight and
# submits that exact build to Apple. If the pair can't be found in
# TestFlight, the run fails before touching App Store Connect metadata.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYYY.MM.DD) of the existing TestFlight build to submit'
        required: true
        type: string
      build_number:
        description: 'Build number of the existing TestFlight build to submit (the betas/ number)'
        required: true
        type: string
      submit_for_review:
        description: 'Submit to App Store Review? Leave unchecked to only stage the version and metadata.'
        required: false
        type: boolean
        default: false

jobs:
  submit:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 1. Check out the release candidate branch for this version
      #    Nothing is built here, so this is about operating on the ref
      #    that actually shipped. A missing branch is only a warning -
      #    the TestFlight check in step 3 is the real gate.
      # -------------------------------------------------------
      - name: Check out release candidate branch
        id: branch
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          BRANCH="release-candidate/$VERSION"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          if git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Checked out $BRANCH at $(git rev-parse HEAD)"
          else
            echo "::warning::$BRANCH not found on remote, staying on ${{ github.ref_name }}. The Beta workflow normally creates this branch."
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # 2. Set up fastlane and App Store credentials
      # -------------------------------------------------------
      - name: Install fastlane
        run: bundle install

      - name: Write App Store API Key
        run: |
          mkdir -p ~/.appstore
          echo "${{ secrets.APP_STORE_API_KEY }}" > ~/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          echo "APP_STORE_KEY_PATH=$HOME/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8" >> $GITHUB_ENV

      # -------------------------------------------------------
      # 3. Verify the build exists in TestFlight
      #    Fails the run if the version/build pair isn't there, or is
      #    still processing, before any metadata is written.
      # -------------------------------------------------------
      - name: Verify TestFlight build exists
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          bundle exec fastlane verify_testflight_build

      # -------------------------------------------------------
      # 4. Fetch "What's New" translations from Google Sheet
      # -------------------------------------------------------
      - name: Fetch release notes translations
        run: |
          python3 << 'EOF'
          import urllib.request
          import csv
          import os
          from io import StringIO

          SHEET_ID = "16pac3mausm9_ExRKuywfMlnsz2INKcQHu1e23q0XYrk"
          RELEASE_NOTES_GID = "583738222"
          RELEASE_NOTES_FALLBACK_GID = "1133737241"

          def fetch_tab(gid):
            url = f"https://docs.google.com/spreadsheets/d/{SHEET_ID}/export?format=csv&gid={gid}"
            with urllib.request.urlopen(url) as resp:
              return list(csv.DictReader(StringIO(resp.read().decode('utf-8'))))

          primary_rows = fetch_tab(RELEASE_NOTES_GID)

          # Check if en-US has content in primary tab
          en_us_notes = next(
            (row.get('Notes', '').strip() for row in primary_rows
             if row.get('App Store Connect Code', '').strip() == 'en-US'),
            ''
          )

          # If en-US is empty, use entire fallback tab instead
          if not en_us_notes:
            print("en-US is empty in primary tab, using entire fallback tab")
            rows = fetch_tab(RELEASE_NOTES_FALLBACK_GID)
          else:
            print("en-US has content, using primary tab")
            rows = primary_rows

          for row in rows:
            code = row.get('App Store Connect Code', '').strip()
            notes = row.get('Notes', '').strip()

            if not code or not notes:
              print(f"Skipping {code} — no notes")
              continue

            os.makedirs(f'fastlane/metadata/{code}', exist_ok=True)
            with open(f'fastlane/metadata/{code}/release_notes.txt', 'w') as f:
              f.write(notes)

            print(f"✓ {code}")
          EOF

      # -------------------------------------------------------
      # 5. Submit the existing TestFlight build to App Store Review
      # -------------------------------------------------------
      - name: Submit to App Store
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          SUBMIT_FOR_REVIEW: ${{ github.event.inputs.submit_for_review }}
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          bundle exec fastlane submit_appstore

      # -------------------------------------------------------
      # 6. Update release task with release branch and submission date
      # -------------------------------------------------------
      - name: Update release task with release branch and submission date
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          VERSION: ${{ github.event.inputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          SUBMIT_FOR_REVIEW: ${{ github.event.inputs.submit_for_review }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import os
          from datetime import datetime, timezone

          token = os.environ['PHAB_TOKEN']
          version = os.environ['VERSION']
          branch = os.environ['BRANCH']
          submit_for_review = os.environ['SUBMIT_FOR_REVIEW'] == 'true'

          release_pattern = re.compile(r'^Release \d{4}\.\d{2}\.\d{2}')

          def release_branch_value(description):
            match = re.search(r'\*\*Release branch\*\*:(.*)', description)
            return match.group(1).strip() if match else ''

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.search',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'constraints[projects][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
              'constraints[statuses][0]': 'open',
              'order': 'newest',
              'limit': '100',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read())

          tasks = data.get('result', {}).get('data', [])

          def matching_tasks(predicate):
            return [
              t for t in tasks
              if release_pattern.match(t.get('fields', {}).get('name', ''))
              and predicate(release_branch_value(t.get('fields', {}).get('description', {}).get('raw', '')))
            ]

          # A re-submission (e.g. after Apple rejects and a fix is pushed to
          # the same release branch) will find this task already stamped
          # with the branch - match that first. Otherwise fall back to the
          # task still tracking main, which this run is graduating into the
          # release branch for the first time.
          already_branched = matching_tasks(lambda v: v == branch)
          not_yet_branched = matching_tasks(lambda v: not v)
          release_task = (already_branched or not_yet_branched or [None])[0]

          if not release_task:
            print("No matching open release task found, skipping")
            exit(0)

          task_phid = release_task['phid']
          description = release_task.get('fields', {}).get('description', {}).get('raw', '')

          def set_field(description, field, value):
            pattern = re.compile(rf'(\*\*{re.escape(field)}\*\*:).*')
            if pattern.search(description):
              return pattern.sub(rf'\1 {value}', description, count=1)
            insertion = f"**{field}**: {value}"
            if '**Included Tasks:**' in description:
              before, marker, after = description.partition('**Included Tasks:**')
              return before.rstrip() + "\n" + insertion + "\n\n" + marker + after
            return description.rstrip() + f"\n\n{insertion}"

          description = set_field(description, 'Release version', version)
          description = set_field(description, 'Release branch', branch)

          if submit_for_review:
            submission_date = datetime.now(timezone.utc).strftime('%Y.%m.%d')
            description = set_field(description, 'App Store Submission Date', submission_date)

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.edit',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'objectIdentifier': task_phid,
              'transactions[0][type]': 'title',
              'transactions[0][value]': f'Release {version}',
              'transactions[1][type]': 'description',
              'transactions[1][value]': description,
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            result = json.loads(resp.read())
            if not result.get('error_code'):
              print(f"✓ Updated release task to 'Release {version}' (branch={branch}, submitted={submit_for_review})")
            else:
              print(f"✗ Failed to update release task: {result.get('error_info')}")
          EOF
