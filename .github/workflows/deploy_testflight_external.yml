name: External TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 1. Compute build number
      # -------------------------------------------------------
      - name: Compute build number
        id: versioning
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            Wikipedia/Wikipedia-Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          LATEST=$(git tag --list 'betas/*' \
            | sed 's|betas/||' \
            | sort -n \
            | tail -1)
          BUILD=$(( ${LATEST:-0} + 1 ))
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD"

      # -------------------------------------------------------
      # 2. Find new PRs since last release tag
      # -------------------------------------------------------
      - name: Find new PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import re
          import os

          result = subprocess.run(
            ['git', 'tag', '--list', 'releases/*', '--sort=-version:refname'],
            capture_output=True, text=True
          )
          tags = result.stdout.strip().split('\n')
          last_release_tag = next((t for t in tags if t), None)

          if not last_release_tag:
            print("No release tag found, skipping PR lookup")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("pr_numbers=\n")
            exit(0)

          print(f"Last release tag: {last_release_tag}")

          result = subprocess.run(
            ['git', 'log', '--oneline', '--merges', f'{last_release_tag}..HEAD'],
            capture_output=True, text=True
          )
          commits = result.stdout.strip().split('\n')

          pr_numbers = []
          for commit in commits:
            match = re.search(r'Merge pull request #(\d+)', commit)
            if match:
              pr_numbers.append(match.group(1))

          print(f"Found PRs since last release: {pr_numbers}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"pr_numbers={','.join(pr_numbers)}\n")
            f.write(f"last_release_tag={last_release_tag}\n")
          EOF

      # -------------------------------------------------------
      # 3. Fetch Phabricator tasks from PRs
      # -------------------------------------------------------
      - name: Fetch Phabricator tasks from PRs
        id: phab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ALL_PR_NUMBERS: ${{ steps.prs.outputs.pr_numbers }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.error
          import json
          import re
          import os

          all_pr_numbers_str = os.environ.get('ALL_PR_NUMBERS', '')
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']

          def fetch_phab_tasks(pr_numbers):
            phab_tasks = []
            for pr_num in pr_numbers:
              url = f"https://api.github.com/repos/{repo}/pulls/{pr_num}"
              req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
              body = ''
              for attempt in range(3):
                try:
                  with urllib.request.urlopen(req) as resp:
                    body = json.loads(resp.read()).get('body') or ''
                  break
                except urllib.error.HTTPError as e:
                  if e.code == 504 and attempt < 2:
                    print(f"PR #{pr_num}: 504 timeout, retrying ({attempt + 1}/3)...")
                    import time
                    time.sleep(5)
                  else:
                    print(f"Could not fetch PR #{pr_num}: {e}")
                    break

              phab_section = re.findall(
                r'\*{0,2}Phabricator:\*{0,2}\s*((?:https://phabricator\.wikimedia\.org/T\d+[\s,]*)+)',
                body, re.IGNORECASE
              )
              for section in phab_section:
                urls = re.findall(r'https://phabricator\.wikimedia\.org/T\d+', section)
                phab_tasks.extend(urls)

            return list(dict.fromkeys(phab_tasks))

          if all_pr_numbers_str:
            all_pr_numbers = [p for p in all_pr_numbers_str.split(',') if p]
            all_tasks = fetch_phab_tasks(all_pr_numbers)
            print(f"All Phabricator tasks (since last release): {all_tasks}")
            with open('/tmp/phab_tasks.txt', 'w') as f:
              f.write('\n'.join(f'• {t}' for t in all_tasks))
          else:
            print("No PRs since last release")
            open('/tmp/phab_tasks.txt', 'w').close()
            all_tasks = []

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"all_phab_task_urls={','.join(all_tasks)}\n")
          EOF

      # -------------------------------------------------------
      # 4. Fetch "What to Test" notes from Google Sheet
      # -------------------------------------------------------
      - name: Fetch What to Test notes
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import csv
          import json
          import os
          from io import StringIO

          SHEET_ID = "16pac3mausm9_ExRKuywfMlnsz2INKcQHu1e23q0XYrk"
          WHAT_TO_TEST_GID = "0"
          WHAT_TO_TEST_FALLBACK_GID = "1976262091"

          version = os.environ['VERSION']
          build = os.environ['BUILD']

          def fetch_tab(gid):
            url = f"https://docs.google.com/spreadsheets/d/{SHEET_ID}/export?format=csv&gid={gid}"
            with urllib.request.urlopen(url) as resp:
              return list(csv.DictReader(StringIO(resp.read().decode('utf-8'))))

          primary_rows = fetch_tab(WHAT_TO_TEST_GID)

          # Check if en-US has content in primary tab
          en_us_notes = next(
            (row.get('Notes', '').strip() for row in primary_rows
             if row.get('App Store Connect Code', '').strip() == 'en-US'),
            ''
          )

          # If en-US is empty, use entire fallback tab instead
          if not en_us_notes:
            print("en-US is empty in primary tab, using entire fallback tab")
            rows = fetch_tab(WHAT_TO_TEST_FALLBACK_GID)
          else:
            print("en-US has content, using primary tab")
            rows = primary_rows

          localized = {}
          for row in rows:
            code = row.get('App Store Connect Code', '').strip()
            notes = row.get('Notes', '').strip()
            if not code or not notes:
              continue
            localized[code] = f"Build: {version} ({build})\n\n{notes}"

          with open('/tmp/what_to_test.json', 'w') as f:
            json.dump(localized, f)

          print(f"Fetched notes for {len(localized)} languages")
          EOF

      # -------------------------------------------------------
      # 5. Update build number in Info.plist
      # -------------------------------------------------------
      - name: Update build number
        env:
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion $BUILD" \
            Wikipedia/Wikipedia-Info.plist

          echo "Updated CFBundleVersion to $BUILD"

      # -------------------------------------------------------
      # 6. Build and upload to TestFlight (external)
      # -------------------------------------------------------
      - name: Install fastlane
        run: bundle install

      - name: Write App Store API Key
        run: |
          mkdir -p ~/.appstore
          echo "${{ secrets.APP_STORE_API_KEY }}" > ~/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          echo "APP_STORE_KEY_PATH=$HOME/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8" >> $GITHUB_ENV

      - name: Build and upload to external TestFlight
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
        run: |
          bundle exec fastlane external_beta

      # -------------------------------------------------------
      # 7. Tag the build
      # -------------------------------------------------------
      - name: Tag build
        env:
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "betas/$BUILD"
          git push origin "betas/$BUILD"

      # -------------------------------------------------------
      # 8. Create Phabricator release task
      # -------------------------------------------------------
      - name: Create Phabricator release task
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          SEARCH_RESULT=$(curl -s \
            --header "User-Agent: GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)" \
            https://phabricator.wikimedia.org/api/maniphest.search \
            -d "api.token=$PHAB_TOKEN" \
            -d "constraints[fullText]=Release $VERSION" \
            -d "constraints[projects][0]=PHID-PROJ-ojylfmfiogxrvnxoiwlp")

          cat > /tmp/check_phab.py << 'EOF'
          import sys, json, os
          data = json.load(sys.stdin)
          tasks = data.get('result', {}).get('data', [])
          title = f"Release {os.environ['VERSION']}"
          found = any(t.get('fields', {}).get('name') == title for t in tasks)
          print('found' if found else 'not_found')
          EOF

          EXISTING=$(echo "$SEARCH_RESULT" | python3 /tmp/check_phab.py)

          if [ "$EXISTING" = "found" ]; then
            echo "Release task for $VERSION already exists, skipping"
            exit 0
          fi

          echo "Creating release task for $VERSION..."
          DESCRIPTION=$'**Release version**:\n**Release tag**:\n**Release SHA1**:\n**App Store Submission Date**:\n**App Store Approval Date**:\n**App Store Release Date**:'

          curl --header "User-Agent: GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)" \
            https://phabricator.wikimedia.org/api/maniphest.edit \
            -d "api.token=$PHAB_TOKEN" \
            -d "transactions[0][type]=title" \
            -d "transactions[0][value]=Release $VERSION" \
            -d "transactions[1][type]=description" \
            -d "transactions[1][value]=$DESCRIPTION" \
            -d "transactions[2][type]=projects.add" \
            -d "transactions[2][value][0]=PHID-PROJ-ojylfmfiogxrvnxoiwlp"

      # -------------------------------------------------------
      # 9. Update release task with included tasks
      # -------------------------------------------------------
      - name: Update release task with included tasks
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          ALL_PHAB_TASK_URLS: ${{ steps.phab.outputs.all_phab_task_urls }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import os

          token = os.environ['PHAB_TOKEN']
          version = os.environ['VERSION']
          task_urls = os.environ.get('ALL_PHAB_TASK_URLS', '')

          if not task_urls:
            print("No Phabricator tasks found, skipping release task update")
            exit(0)

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.search',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'constraints[fullText]': f'Release {version}',
              'constraints[projects][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read())

          tasks = data.get('result', {}).get('data', [])
          release_task = next(
            (t for t in tasks if t.get('fields', {}).get('name') == f'Release {version}'),
            None
          )

          if not release_task:
            print(f"No release task found for Release {version}, skipping")
            exit(0)

          task_phid = release_task['phid']
          current_description = release_task.get('fields', {}).get('description', {}).get('raw', '')

          task_list = '\n'.join(task_urls.split(','))
          new_section = f"\n\n**Included Tasks:**\n{task_list}"

          if '**Included Tasks:**' in current_description:
            new_description = current_description.split('**Included Tasks:**')[0].rstrip() + new_section
          else:
            new_description = current_description.rstrip() + new_section

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.edit',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'objectIdentifier': task_phid,
              'transactions[0][type]': 'description',
              'transactions[0][value]': new_description,
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            result = json.loads(resp.read())
            if not result.get('error_code'):
              print(f"✓ Updated release task for Release {version}")
            else:
              print(f"✗ Failed to update release task: {result.get('error_info')}")
          EOF
