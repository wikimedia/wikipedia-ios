name: Run Saved Tab UI Tests

# The Saved tab is being rewritten in SwiftUI (T441442). These fixture-backed journeys
# are the parity net for that work, so they run on every pull request.
# Delete this workflow when the rewrite ships. The nightly run keeps the coverage.

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  XCODE_VERSION: "26.5"
  IOS_VERSION: "26.5"
  SIMULATOR_NAME: "iPhone 17"
  UI_TEST_CONFIGURATION: "English (Light)"
  UI_TEST_CLASS: "WikipediaUITests/SavedUITests"

concurrency:
  group: "saved-ui-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  run-saved-ui-tests:
    runs-on: macos-26
    name: Test SavedUITests
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Ensure UI tests use test-plan appearance and language
        run: scripts/lint-ui-tests.sh

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          ios-version: ${{ env.IOS_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Run SavedUITests
        run: |
          echo "Running ${UI_TEST_CLASS} ${UI_TEST_CONFIGURATION} [Mocked] on ${SIMULATOR_NAME} iOS ${IOS_VERSION} with Xcode ${XCODE_VERSION}"
          xcodebuild test \
            -scheme WikipediaUITests \
            -project Wikipedia.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -testPlan UITests \
            -only-test-configuration "${UI_TEST_CONFIGURATION}" \
            -only-testing:"${UI_TEST_CLASS}" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath "SavedUITests_TestResults" \
            | xcpretty
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SavedUITests-TestResults
          path: SavedUITests_TestResults.xcresult
          if-no-files-found: ignore
