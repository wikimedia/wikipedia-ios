name: V2 Deploy Beta

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Start a new release cycle, or continue the one already in progress'
        required: true
        type: choice
        default: existing
        options:
          - existing
          - new
      version:
        description: 'Only for mode=new: the version to release, as YYYY.MM.DD. Normally the date you plan to ship to the App Store. Ignored when mode=existing.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  XCODE_VERSION: "26.6"

# Serialize runs, for the same reason as V2 Deploy Alpha: the build number is
# read from the highest betas/ tag at checkout, but that tag is not pushed
# until the run finishes, so overlapping runs would compute the same number and
# App Store Connect would reject the second upload. cancel-in-progress stays
# false so a run is never killed between its TestFlight upload and its tag push.
concurrency:
  group: v2-deploy-beta
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # -------------------------------------------------------
      # 1. Resolve the release cycle - its version, branch and task
      #
      #    A cycle is a release-candidate/YYYY.MM.DD branch plus an open
      #    Phabricator release task, and the two are kept in lockstep. Only
      #    one cycle may be open at a time, so neither mode ever has to
      #    guess which branch to build; a second one is an error. Hotfixes
      #    are meant to branch under hotfix/ and get their own workflow
      #    rather than opening a second release candidate here.
      #
      #    mode=new starts a cycle at the version you enter - normally the
      #    date you plan to ship, so the version a build carries is the date
      #    it is meant to be released on rather than the date it was built.
      #    It refuses to run if either a release candidate branch or an open
      #    release task is already there, so a cycle has to be finished and
      #    cleaned up before the next one starts.
      #
      #    mode=existing continues the cycle already in progress and takes
      #    the version from its branch, so no version has to be entered
      #    again. It refuses to run if there is no cycle to continue.
      # -------------------------------------------------------
      - name: Find open release task
        id: release_task
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import os

          token = os.environ['PHAB_TOKEN']
          release_pattern = re.compile(r'^Release \d{4}\.\d{2}\.\d{2}')

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.search',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'constraints[projects][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
              'constraints[statuses][0]': 'open',
              'order': 'newest',
              'limit': '100',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read())

          # Fail rather than guess. This step gates whether a new cycle may
          # start, so an unreachable Phabricator has to stop the run - and it
          # runs before the build, so nothing is wasted by stopping here.
          if data.get('error_code'):
            print(f"::error::Phabricator lookup failed: {data.get('error_info')}")
            raise SystemExit(1)

          tasks = [
            t for t in data.get('result', {}).get('data', [])
            if release_pattern.match(t.get('fields', {}).get('name', ''))
          ]

          names = '; '.join(f"T{t['id']} {t['fields']['name']}" for t in tasks)
          versions = ' '.join(t['fields']['name'].split()[1] for t in tasks)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write(f"count={len(tasks)}\n")
            out.write(f"names={names}\n")
            out.write(f"versions={versions}\n")

          print(f"Found {len(tasks)} open release task(s)" + (f": {names}" if tasks else ""))
          EOF

      - name: Resolve release candidate branch
        id: branch
        env:
          MODE: ${{ github.event.inputs.mode }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TASK_COUNT: ${{ steps.release_task.outputs.count }}
          TASK_NAMES: ${{ steps.release_task.outputs.names }}
          TASK_VERSIONS: ${{ steps.release_task.outputs.versions }}
        run: |
          git fetch origin --tags --prune '+refs/heads/*:refs/remotes/origin/*'

          CANDIDATES=$(git branch -r --list 'origin/release-candidate/*' \
            | sed 's|^[[:space:]]*origin/||' \
            | grep -E '^release-candidate/[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' \
            | sort -r)

          COUNT=$(printf '%s' "$CANDIDATES" | grep -c . || true)
          EXISTING=$(printf '%s\n' "$CANDIDATES" | head -1)
          CANDIDATE_LIST=$(printf '%s' "$CANDIDATES" | tr '\n' ' ')

          if [ "$MODE" = "new" ]; then
            if [ -z "$INPUT_VERSION" ]; then
              echo "::error::mode=new needs a version. Re-run and enter the release date as YYYY.MM.DD."
              exit 1
            fi

            # The branch name and the Phabricator task title are both matched
            # by date-shaped regexes elsewhere in this workflow, so a version
            # in any other shape would silently fail to be found later.
            if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
              echo "::error::Version '$INPUT_VERSION' is not YYYY.MM.DD."
              exit 1
            fi

            if [ "$COUNT" -gt 0 ]; then
              echo "::error::Cannot start $INPUT_VERSION - release candidate branch already exists: $CANDIDATE_LIST. Finish and delete that cycle's branch, or re-run with mode=existing."
              exit 1
            fi

            if [ "$TASK_COUNT" -gt 0 ]; then
              echo "::error::Cannot start $INPUT_VERSION - an open Phabricator release task already exists: $TASK_NAMES. Close it, or re-run with mode=existing."
              exit 1
            fi

            VERSION="$INPUT_VERSION"
            BRANCH="release-candidate/$VERSION"
            # Cut from the dispatched ref (HEAD as checked out above) rather
            # than hardcoding main, so a test run against a feature branch
            # builds that branch instead of silently building main. It is
            # only pushed once the build has uploaded (step 9), so a failed
            # build doesn't leave a stray branch behind.
            echo "Starting release cycle $VERSION, cutting $BRANCH from ${GITHUB_REF_NAME}"
            git checkout -B "$BRANCH"
            echo "created=true" >> $GITHUB_OUTPUT
          else
            if [ -n "$INPUT_VERSION" ]; then
              echo "::warning::Ignoring version '$INPUT_VERSION' - mode=existing takes its version from the release candidate branch."
            fi

            # A cycle is exactly one release candidate branch and exactly
            # one open release task, both naming the same version. Anything
            # else means the cycle is not in a state worth building from, so
            # say which part is wrong and stop here - before a 25 minute
            # archive, a TestFlight upload and a beta review submission.
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No release-candidate/* branch exists, so there is no cycle to continue. Re-run with mode=new and a version to start one."
              exit 1
            fi

            if [ "$COUNT" -gt 1 ]; then
              echo "::error::$COUNT release candidate branches exist: $CANDIDATE_LIST. Only one is allowed at a time - V2 Release Wrap Up deletes it at the end of a cycle. Delete all but the one you are releasing, then re-run."
              exit 1
            fi

            if [ "$TASK_COUNT" -eq 0 ]; then
              echo "::error::No open Phabricator release task exists, so there is no cycle to continue. Re-run with mode=new and a version to start one."
              exit 1
            fi

            if [ "$TASK_COUNT" -gt 1 ]; then
              echo "::error::$TASK_COUNT open Phabricator release tasks exist: $TASK_NAMES. Only one is allowed at a time. Close all but the one for the cycle you are releasing, then re-run."
              exit 1
            fi

            BRANCH="$EXISTING"
            VERSION="${BRANCH#release-candidate/}"

            # Exactly one task is open by this point, so TASK_VERSIONS holds
            # exactly one version. It has to be the branch's: if they name
            # different releases there is no safe guess about which one this
            # build belongs to.
            if [ "$TASK_VERSIONS" != "$VERSION" ]; then
              echo "::error::Release candidate branch is $VERSION but the open release task is for $TASK_VERSIONS ($TASK_NAMES). Rename whichever is wrong so the two match, then re-run."
              exit 1
            fi

            echo "Continuing release cycle $VERSION (branch $BRANCH, task $TASK_NAMES)"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "created=false" >> $GITHUB_OUTPUT
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building $VERSION from $BRANCH at $(git rev-parse HEAD)"

      # -------------------------------------------------------
      # 2. Compute build number
      # -------------------------------------------------------
      - name: Compute build number
        id: versioning
        run: |
          LATEST=$(git tag --list 'betas/*' \
            | sed 's|betas/||' \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -1)
          BUILD=$(( ${LATEST:-0} + 1 ))
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: ${{ steps.branch.outputs.version }}, Build: $BUILD"

      # -------------------------------------------------------
      # 3. Find new PRs since last release tag (for the release task)
      # -------------------------------------------------------
      - name: Find new PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import re
          import os

          result = subprocess.run(
            ['git', 'tag', '--list', 'releases/*', '--sort=-version:refname'],
            capture_output=True, text=True
          )
          tags = result.stdout.strip().split('\n')
          last_release_tag = next((t for t in tags if t), None)

          if not last_release_tag:
            print("No release tag found, skipping PR lookup")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("pr_numbers=\n")
            exit(0)

          print(f"Last release tag: {last_release_tag}")

          result = subprocess.run(
            ['git', 'log', '--oneline', f'{last_release_tag}..HEAD'],
            capture_output=True, text=True
          )
          commits = result.stdout.strip().split('\n')

          pr_numbers = []
          for commit in commits:
            # Matches both merge-commit PRs ("Merge pull request #123")
            # and squash-merge PRs ("Fix campaign modal (#123)")
            match = re.search(r'Merge pull request #(\d+)', commit) or re.search(r'\(#(\d+)\)\s*$', commit)
            if match:
              pr_numbers.append(match.group(1))

          print(f"Found PRs since last release: {pr_numbers}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"pr_numbers={','.join(pr_numbers)}\n")
            f.write(f"last_release_tag={last_release_tag}\n")
          EOF

      # -------------------------------------------------------
      # 4. Find new PRs since last beta tag (for Phabricator commenting)
      # -------------------------------------------------------
      - name: Find new PRs since last beta
        id: new_prs
        run: |
          python3 << 'EOF'
          import subprocess
          import re
          import os

          result = subprocess.run(
            ['git', 'tag', '--list', 'betas/*', '--sort=-version:refname'],
            capture_output=True, text=True
          )
          tags = result.stdout.strip().split('\n')
          last_beta_tag = next((t for t in tags if t), None)

          if not last_beta_tag:
            print("No beta tag found, skipping new PR lookup")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("new_pr_numbers=\n")
            exit(0)

          print(f"Last beta tag: {last_beta_tag}")

          result = subprocess.run(
            ['git', 'log', '--oneline', f'{last_beta_tag}..HEAD'],
            capture_output=True, text=True
          )
          commits = result.stdout.strip().split('\n')

          pr_numbers = []
          for commit in commits:
            # Matches both merge-commit PRs ("Merge pull request #123")
            # and squash-merge PRs ("Fix campaign modal (#123)")
            match = re.search(r'Merge pull request #(\d+)', commit) or re.search(r'\(#(\d+)\)\s*$', commit)
            if match:
              pr_numbers.append(match.group(1))

          print(f"Found PRs since last beta: {pr_numbers}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"new_pr_numbers={','.join(pr_numbers)}\n")
          EOF

      # -------------------------------------------------------
      # 5. Fetch Phabricator tasks from PRs
      #    - All PRs since last release → release task Included Tasks
      #    - New PRs since last beta → Phabricator commenting
      #    (What to Test notes come from the Google Sheet, not from here)
      # -------------------------------------------------------
      - name: Fetch Phabricator tasks from PRs
        id: phab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ALL_PR_NUMBERS: ${{ steps.prs.outputs.pr_numbers }}
          NEW_PR_NUMBERS: ${{ steps.new_prs.outputs.new_pr_numbers }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.error
          import json
          import re
          import os

          all_pr_numbers_str = os.environ.get('ALL_PR_NUMBERS', '')
          new_pr_numbers_str = os.environ.get('NEW_PR_NUMBERS', '')
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']

          def fetch_phab_tasks(pr_numbers):
            phab_tasks = []
            for pr_num in pr_numbers:
              url = f"https://api.github.com/repos/{repo}/pulls/{pr_num}"
              req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
              body = ''
              for attempt in range(3):
                try:
                  with urllib.request.urlopen(req) as resp:
                    body = json.loads(resp.read()).get('body') or ''
                  break
                except urllib.error.HTTPError as e:
                  if e.code == 504 and attempt < 2:
                    print(f"PR #{pr_num}: 504 timeout, retrying ({attempt + 1}/3)...")
                    import time
                    time.sleep(5)
                  else:
                    print(f"Could not fetch PR #{pr_num}: {e}")
                    break

              phab_section = re.findall(
                r'\*{0,2}Phabricator:\*{0,2}\s*((?:https://phabricator\.wikimedia\.org/T\d+[\s,]*)+)',
                body, re.IGNORECASE
              )
              for section in phab_section:
                urls = re.findall(r'https://phabricator\.wikimedia\.org/T\d+', section)
                phab_tasks.extend(urls)

            return list(dict.fromkeys(phab_tasks))

          # All tasks since last release → release task Included Tasks
          if all_pr_numbers_str:
            all_pr_numbers = [p for p in all_pr_numbers_str.split(',') if p]
            all_tasks = fetch_phab_tasks(all_pr_numbers)
            print(f"All Phabricator tasks (since last release): {all_tasks}")
            with open('/tmp/phab_tasks.txt', 'w') as f:
              f.write('\n'.join(f'• {t}' for t in all_tasks))
          else:
            print("No PRs since last release")
            open('/tmp/phab_tasks.txt', 'w').close()
            all_tasks = []

          # New tasks since last beta → for Phabricator commenting
          if new_pr_numbers_str:
            new_pr_list = [p for p in new_pr_numbers_str.split(',') if p]
            new_tasks = fetch_phab_tasks(new_pr_list)
            print(f"New Phabricator tasks (since last beta): {new_tasks}")
          else:
            print("No new PRs since last beta, skipping Phabricator commenting")
            new_tasks = []

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"phab_task_urls={','.join(new_tasks)}\n")
            f.write(f"all_phab_task_urls={','.join(all_tasks)}\n")
          EOF

      # -------------------------------------------------------
      # 6. Fetch "What to Test" notes from Google Sheet
      #    External testers get per-locale notes, so these come from the
      #    sheet rather than from the Phabricator task list.
      # -------------------------------------------------------
      - name: Fetch What to Test notes
        env:
          VERSION: ${{ steps.branch.outputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import csv
          import json
          import os
          from io import StringIO

          SHEET_ID = "16pac3mausm9_ExRKuywfMlnsz2INKcQHu1e23q0XYrk"
          WHAT_TO_TEST_GID = "0"
          WHAT_TO_TEST_FALLBACK_GID = "1976262091"

          version = os.environ['VERSION']
          build = os.environ['BUILD']

          def fetch_tab(gid):
            url = f"https://docs.google.com/spreadsheets/d/{SHEET_ID}/export?format=csv&gid={gid}"
            with urllib.request.urlopen(url) as resp:
              return list(csv.DictReader(StringIO(resp.read().decode('utf-8'))))

          primary_rows = fetch_tab(WHAT_TO_TEST_GID)

          # Check if en-US has content in primary tab
          en_us_notes = next(
            (row.get('Notes', '').strip() for row in primary_rows
             if row.get('App Store Connect Code', '').strip() == 'en-US'),
            ''
          )

          # If en-US is empty, use entire fallback tab instead
          if not en_us_notes:
            print("en-US is empty in primary tab, using entire fallback tab")
            rows = fetch_tab(WHAT_TO_TEST_FALLBACK_GID)
          else:
            print("en-US has content, using primary tab")
            rows = primary_rows

          localized = {}
          for row in rows:
            code = row.get('App Store Connect Code', '').strip()
            notes = row.get('Notes', '').strip()
            if not code or not notes:
              continue
            localized[code] = f"Build: {version} ({build})\n\n{notes}"

          with open('/tmp/what_to_test.json', 'w') as f:
            json.dump(localized, f)

          print(f"Fetched notes for {len(localized)} languages")
          EOF

      # -------------------------------------------------------
      # 7. Update version and build number in Info.plist files
      # -------------------------------------------------------
      - name: Update version and build number
        env:
          VERSION: ${{ steps.branch.outputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          PLISTS=(
            "WMF Framework/Info.plist"
            "Wikipedia Stickers/Info.plist"
            "Wikipedia/Experimental-Info.plist"
            "Wikipedia/Local-Info.plist"
            "Wikipedia/Alpha-Info.plist"
            "Wikipedia/Wikipedia-Info.plist"
            "ContinueReadingWidget/Info.plist"
            "WikipediaUnitTests/Info.plist"
            "Widgets/Info.plist"
            "NotificationServiceExtension/Info.plist"
          )

          for PLIST in "${PLISTS[@]}"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          done

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "Wikipedia/Wikipedia-Info.plist"

          echo "Updated CFBundleShortVersionString to $VERSION and CFBundleVersion to $BUILD"

      # -------------------------------------------------------
      # 8. Build and upload to TestFlight (external)
      # -------------------------------------------------------
      - name: Install fastlane
        run: bundle install

      - name: Write App Store API Key
        run: |
          mkdir -p ~/.appstore
          echo "${{ secrets.APP_STORE_API_KEY }}" > ~/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          echo "APP_STORE_KEY_PATH=$HOME/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8" >> $GITHUB_ENV

      - name: Build and upload to external TestFlight
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
        run: |
          bundle exec fastlane beta

      # -------------------------------------------------------
      # 9. Push the release candidate branch and tag the build
      # -------------------------------------------------------
      - name: Push release candidate branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          CREATED: ${{ steps.branch.outputs.created }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ "$CREATED" = "true" ]; then
            # Push as wmf-apps-ci like our other automated repo writes;
            # GITHUB_TOKEN cannot push a ref whose tree touches .github/workflows/**.
            git push https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} "HEAD:refs/heads/$BRANCH"
            echo "Pushed new release candidate branch $BRANCH"
          else
            echo "$BRANCH already exists on remote, nothing to push"
          fi

      - name: Tag build
        env:
          BUILD: ${{ steps.versioning.outputs.build }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "betas/$BUILD"
          # Push as wmf-apps-ci like our other automated repo writes;
          # GITHUB_TOKEN cannot push a ref whose tree touches .github/workflows/**.
          git push https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} "betas/$BUILD"

      # -------------------------------------------------------
      # 10. Post to Phabricator tasks
      # -------------------------------------------------------
      - name: Post to Phabricator tasks
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          PHAB_TASK_URLS: ${{ steps.phab.outputs.phab_task_urls }}
          VERSION: ${{ steps.branch.outputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          if [ -z "$PHAB_TASK_URLS" ]; then
            echo "No Phabricator tasks to comment on"
            exit 0
          fi

          MESSAGE="Available in: TestFlight Wikipedia $VERSION ($BUILD)"

          echo "$PHAB_TASK_URLS" | tr ',' '\n' | while IFS= read -r url; do
            TASK_ID=$(echo "$url" | grep -oEi "T[0-9]+$")
            if [ -z "$TASK_ID" ]; then
              continue
            fi
            echo "Commenting on $TASK_ID..."
            curl --header "User-Agent: GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)" \
              https://phabricator.wikimedia.org/api/maniphest.edit \
              -d "api.token=$PHAB_TOKEN" \
              -d "transactions[0][type]=comment" \
              -d "transactions[0][value]=$MESSAGE" \
              -d "objectIdentifier=$TASK_ID"
            echo "✓ Commented on $TASK_ID"
          done

      # -------------------------------------------------------
      # 11. Create Phabricator release task
      # -------------------------------------------------------
      - name: Create Phabricator release task
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          VERSION: ${{ steps.branch.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import os

          token = os.environ['PHAB_TOKEN']
          version = os.environ['VERSION']
          branch = os.environ['BRANCH']

          release_pattern = re.compile(r'^Release \d{4}\.\d{2}\.\d{2}')

          def release_branch_value(description):
            match = re.search(r'\*\*Release branch\*\*:(.*)', description)
            return match.group(1).strip() if match else ''

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.search',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'constraints[projects][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
              'constraints[statuses][0]': 'open',
              'order': 'newest',
              'limit': '100',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read())

          tasks = data.get('result', {}).get('data', [])

          def matching_tasks(predicate):
            return [
              t for t in tasks
              if release_pattern.match(t.get('fields', {}).get('name', ''))
              and predicate(release_branch_value(t.get('fields', {}).get('description', {}).get('raw', '')))
            ]

          # A task already stamped with this run's release branch belongs to
          # this cycle (submit_appstore stamps it), and a task with no branch
          # yet is the one still tracking main. Either way, reuse it rather
          # than creating a duplicate for the same version.
          existing_task = (matching_tasks(lambda v: v == branch)
                           or matching_tasks(lambda v: not v)
                           or [None])[0]

          if existing_task:
            print(f"Found existing open release task '{existing_task.get('fields', {}).get('name', '')}' for this cycle, skipping creation")
            exit(0)

          print(f"No eligible open release task found, creating one for {version}...")
          description = '**Release version**:\n**Release branch**:\n**Release tag**:\n**Release SHA1**:\n**App Store Submission Date**:\n**App Store Release Date**:'

          # Wikipedia-iOS-App, WikipediaApp, Release
          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.edit',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'transactions[0][type]': 'title',
              'transactions[0][value]': f'Release {version}',
              'transactions[1][type]': 'description',
              'transactions[1][value]': description,
              'transactions[2][type]': 'projects.add',
              'transactions[2][value][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
              'transactions[2][value][1]': 'PHID-PROJ-iqrw7mfn2e2mvc7f6rir',
              'transactions[2][value][2]': 'PHID-PROJ-pf35un2jsnsiriivnmeo',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            result = json.loads(resp.read())
            if not result.get('error_code'):
              print(f"✓ Created release task 'Release {version}'")
            else:
              print(f"✗ Failed to create release task: {result.get('error_info')}")
          EOF

      # -------------------------------------------------------
      # 12. Update release task with included tasks
      # -------------------------------------------------------
      - name: Update release task with included tasks
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          ALL_PHAB_TASK_URLS: ${{ steps.phab.outputs.all_phab_task_urls }}
          VERSION: ${{ steps.branch.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import os

          token = os.environ['PHAB_TOKEN']
          version = os.environ['VERSION']
          branch = os.environ['BRANCH']
          task_urls = os.environ.get('ALL_PHAB_TASK_URLS', '')

          if not task_urls:
            print("No Phabricator tasks found, skipping release task update")
            exit(0)

          # Search for any open release task with a date-based version title
          release_pattern = re.compile(r'^Release \d{4}\.\d{2}\.\d{2}')

          def release_branch_value(description):
            match = re.search(r'\*\*Release branch\*\*:(.*)', description)
            return match.group(1).strip() if match else ''

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.search',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'constraints[projects][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
              'constraints[statuses][0]': 'open',
              'order': 'newest',
              'limit': '100',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read())

          tasks = data.get('result', {}).get('data', [])

          def matching_tasks(predicate):
            return [
              t for t in tasks
              if release_pattern.match(t.get('fields', {}).get('name', ''))
              and predicate(release_branch_value(t.get('fields', {}).get('description', {}).get('raw', '')))
            ]

          # Prefer the task already stamped with this run's release branch,
          # then the one still tracking main. Any other branch-associated
          # task belongs to an earlier cycle and is left alone.
          release_task = (matching_tasks(lambda v: v == branch)
                          or matching_tasks(lambda v: not v)
                          or [None])[0]

          if not release_task:
            print("No open release task found for this cycle, skipping")
            exit(0)

          task_phid = release_task['phid']
          current_title = release_task.get('fields', {}).get('name', '')
          current_description = release_task.get('fields', {}).get('description', {}).get('raw', '')

          print(f"Found release task: '{current_title}' -> updating title to 'Release {version}'")

          def set_field(description, field, value):
            pattern = re.compile(rf'(\*\*{re.escape(field)}\*\*:).*')
            if pattern.search(description):
              return pattern.sub(rf'\1 {value}', description, count=1)
            insertion = f"**{field}**: {value}"
            if '**Included Tasks:**' in description:
              before, marker, after = description.partition('**Included Tasks:**')
              return before.rstrip() + "\n" + insertion + "\n\n" + marker + after
            return description.rstrip() + f"\n\n{insertion}"

          # Keep the Release version field in the body in sync with the title
          current_description = set_field(current_description, 'Release version', version)

          # Stamp the release branch now that it exists. This is what takes
          # the task out of the nightly Alpha workflow's search, which looks
          # for an open release task with no branch yet and retitles it to
          # that night's date. Without this stamp, the next nightly run would
          # rename this cycle's task and overwrite its Included Tasks with
          # whatever is on main, leaving release_wrap_up unable to find
          # "Release {version}" by title.
          current_description = set_field(current_description, 'Release branch', branch)

          # Build new included tasks section
          task_ids = []
          for url in task_urls.split(','):
            match = re.search(r'T(\d+)$', url.strip())
            if match:
              task_ids.append(f"{{{match.group(0)}}}")
          task_list = '\n'.join(task_ids)
          new_section = f"\n\n**Included Tasks:**\n{task_list}"

          if '**Included Tasks:**' in current_description:
            new_description = current_description.split('**Included Tasks:**')[0].rstrip() + new_section
          else:
            new_description = current_description.rstrip() + new_section

          # Update task title and description
          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.edit',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'objectIdentifier': task_phid,
              'transactions[0][type]': 'title',
              'transactions[0][value]': f'Release {version}',
              'transactions[1][type]': 'description',
              'transactions[1][value]': new_description,
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            result = json.loads(resp.read())
            if not result.get('error_code'):
              print(f"✓ Updated release task to Release {version}")
            else:
              print(f"✗ Failed to update release task: {result.get('error_info')}")
          EOF
