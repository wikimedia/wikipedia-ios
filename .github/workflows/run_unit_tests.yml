name: Run Unit Tests

on:
  pull_request:
    branches:
      - 'main'
      - 'release-candidate/**'
      - 'hotfix/**'
  # A nightly run on main fills the compilation cache that PR runs start from (see
  # below). It runs once a day, outside working hours, rather than on every merge,
  # so it doesn't compete with PRs for macOS runners. It runs after the 02:00 UTC
  # nightly UI tests. Scheduled runs always use the default branch (main).
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  XCODE_VERSION: "27.1"
  IOS_VERSION: "27.0"
  SIMULATOR_NAME: "iPhone 17"
  # Xcode's compilation cache (Xcode 26+). It stores compiler outputs keyed by the
  # content of their inputs, so unlike a DerivedData cache it still hits after
  # actions/checkout gives every file a new modification date.
  #
  # Only the app job uses it. In a trial, a warm cache cut the app build from
  # about 22.6 to 10.6 minutes. The packages compile far less (76 files against
  # 420), and their build gained nothing, so for them restoring and saving the
  # cache would only add time.
  #
  # The nightly run on main builds from an empty cache and saves it, so a saved
  # cache only ever holds one main build and cannot grow without bound. PR runs
  # restore the newest main cache and never save, which also keeps PR runs from
  # filling the repository's cache storage. (GitHub only lets a PR read caches
  # saved on its base branch, so main is the one place a shared cache can come
  # from.) The cache is keyed by file contents, so a cache up to a day old still
  # covers every file that hasn't changed since.
  COMPILATION_CACHE_PATH: "~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"

concurrency:
  group: "unit-tests-${{ github.ref }}"  # One group per branch
  cancel-in-progress: true                # Cancel older runs in the same group

# Two macOS jobs instead of one per scheme. macOS runners are the scarce resource:
# PR runs spend far longer queued for one than running on it.
#
# - The app job is the longest one (about 30 minutes), so it gets its own runner.
# - The package jobs share a runner. Testing WMFComponents compiles WMFData (and
#   WMFDataMocks) into the same DerivedData, so the WMFData tests that follow reuse
#   that build instead of compiling the package again. Together they take about as
#   long as the app job, so the run does not get longer when runners are free.
jobs:
  test-app:
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    name: Test Wikipedia
    steps:
      - uses: actions/checkout@v7

      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          ios-version: ${{ env.IOS_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}
          boot: "false"

      # The cache steps never fail the job: without a cache, xcodebuild just
      # compiles from scratch.
      - name: Restore compilation cache
        if: github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.COMPILATION_CACHE_PATH }}
          key: compilation-cache-xcode-${{ env.XCODE_VERSION }}-Wikipedia-${{ github.sha }}
          # EXPERIMENT C: start from experiment A's cache (same build settings), so
          # the first run is comparable with A's warm run.
          restore-keys: |
            compilation-cache-xcode-${{ env.XCODE_VERSION }}-Wikipedia-${{ github.sha }}-
            compilation-cache-xcode-${{ env.XCODE_VERSION }}-Wikipedia-f79e0c411d4c63ef0dab99e68e3b13d108cb1d01-

      - name: Test Wikipedia
        uses: ./.github/actions/unit-test-scheme
        with:
          scheme: Wikipedia
          destination: ${{ steps.simulator.outputs.destination }}
          simulator-udid: ${{ steps.simulator.outputs.udid }}
          compilation-cache: "true"

      - name: Save compilation cache
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.COMPILATION_CACHE_PATH }}
          key: compilation-cache-xcode-${{ env.XCODE_VERSION }}-Wikipedia-${{ github.sha }}-${{ github.run_id }}

  test-packages:
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    name: Test WMFComponents and WMFData
    outputs:
      wmfcomponents: ${{ steps.wmfcomponents-tests.outcome }}
      wmfdata: ${{ steps.wmfdata-tests.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          ios-version: ${{ env.IOS_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}
          boot: "false"

      - name: Test WMFComponents
        id: wmfcomponents-tests
        uses: ./.github/actions/unit-test-scheme
        with:
          scheme: WMFComponents
          destination: ${{ steps.simulator.outputs.destination }}
          simulator-udid: ${{ steps.simulator.outputs.udid }}

      # The lint and the WMFData tests run even when the WMFComponents tests fail, so
      # one run reports both packages. A lint failure skips only the WMFData tests.
      - name: Ensure tests reset WMFData global environment state
        id: wmfdata-lint
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: scripts/lint-wmfdata-test-fixtures.sh

      - name: Test WMFData
        id: wmfdata-tests
        if: ${{ !cancelled() && steps.wmfdata-lint.outcome == 'success' }}
        uses: ./.github/actions/unit-test-scheme
        with:
          scheme: WMFData
          destination: ${{ steps.simulator.outputs.destination }}
          simulator-udid: ${{ steps.simulator.outputs.udid }}

  # Branch protection on main requires checks named "Test WMFComponents" and
  # "Test WMFData", the names of the per-scheme jobs this workflow used to have.
  # These two jobs keep reporting those names from the shared packages job's
  # results, on cheap Ubuntu runners, so PRs aren't left waiting for checks that
  # never come. Once the required checks are switched to "Test WMFComponents
  # and WMFData", delete both jobs and the test-packages outputs.
  report-wmfcomponents:
    needs: test-packages
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    name: Test WMFComponents
    steps:
      - name: Report the WMFComponents tests from "Test WMFComponents and WMFData"
        env:
          OUTCOME: ${{ needs.test-packages.outputs.wmfcomponents }}
        run: |
          echo "WMFComponents tests: ${OUTCOME:-did not run}"
          test "${OUTCOME}" = "success"

  report-wmfdata:
    needs: test-packages
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    name: Test WMFData
    steps:
      # Skipped counts as a failure: the WMFData tests are skipped when the
      # fixture lint fails, which used to fail the separate WMFData job.
      - name: Report the WMFData tests from "Test WMFComponents and WMFData"
        env:
          OUTCOME: ${{ needs.test-packages.outputs.wmfdata }}
        run: |
          echo "WMFData tests: ${OUTCOME:-did not run}"
          test "${OUTCOME}" = "success"
