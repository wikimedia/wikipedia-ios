name: Run Unit Tests

# DIAGNOSTICS BRANCH ONLY, not for merging. Replaces the unit-test jobs with one job
# that measures where Swift package resolution spends its time on a fresh runner:
#   1. a direct download of Rive's prebuilt framework (the binaryTarget zip),
#   2. xcodebuild -resolvePackageDependencies for WMFComponents, as CI runs it (cold),
#   3. swift package resolve -v for WMFComponents, which prints per-package timings.

on:
  workflow_dispatch:

env:
  XCODE_VERSION: "27.1"

concurrency:
  group: "unit-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package-resolution-diagnostics:
    runs-on: xcode-27
    permissions:
      contents: read
    name: Package resolution diagnostics
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: 1. Download Rive's prebuilt framework directly
        run: |
          RESOLVED="Wikipedia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          VERSION=$(jq -r '.pins[] | select(.identity == "rive-ios") | .state.version' "${RESOLVED}")
          URL=$(curl -sSL "https://raw.githubusercontent.com/rive-app/rive-ios/${VERSION}/Package.swift" \
            | grep -o 'https://[^"]*\.zip' | head -n 1)
          echo "rive-ios ${VERSION}: ${URL}"
          for attempt in 1 2; do
            curl -sSL -o "${RUNNER_TEMP}/rive-${attempt}.zip" \
              -w "attempt ${attempt}: size=%{size_download} bytes, total=%{time_total}s, connect=%{time_connect}s, first byte=%{time_starttransfer}s, speed=%{speed_download} B/s\n" \
              "${URL}"
          done
          ls -la "${RUNNER_TEMP}"/rive-*.zip

      - name: 2. xcodebuild -resolvePackageDependencies (as CI runs it, cold)
        run: |
          set -o pipefail
          START=$(date +%s)
          xcodebuild -resolvePackageDependencies \
            -scheme WMFComponents \
            -project Wikipedia.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            2>&1 | grep -v -E "DVTAssertions|SimDevice native architecture|^Object:|^Method:|^Thread:|feedbackassistant|^\)$" \
            | while IFS= read -r line; do printf '%s +%ss %s\n' "$(date +%T)" "$(( $(date +%s) - START ))" "${line}"; done
          echo "xcodebuild resolve took $(( $(date +%s) - START ))s"
          echo "SourcePackages contents:"
          du -sh "${RUNNER_TEMP}/SourcePackages"/* "${RUNNER_TEMP}/SourcePackages/artifacts"/* 2>/dev/null || true

      - name: 3. swift package resolve -v (per-package timings)
        working-directory: WMFComponents
        run: |
          set -o pipefail
          START=$(date +%s)
          swift package resolve -v 2>&1 \
            | while IFS= read -r line; do printf '%s +%ss %s\n' "$(date +%T)" "$(( $(date +%s) - START ))" "${line}"; done
          echo "swift package resolve took $(( $(date +%s) - START ))s"
          du -sh .build/artifacts/* .build/checkouts/* 2>/dev/null || true
