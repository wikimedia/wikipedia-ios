name: Run Unit Tests

# DIAGNOSTICS BRANCH ONLY, not for merging. Two jobs run side by side on separate
# runners, so each run is a paired comparison under the same conditions:
#   - no-simulator: resolve Swift packages on a fresh runner without booting a simulator
#   - simulator-first: boot the iPhone simulator first (as prepare-simulator does), then
#     resolve the same packages
# Run 1 of the earlier version resolved cold in 54s without a simulator, against 5-7.5
# minutes in the real test jobs, which resolve right after booting the simulator.

on:
  workflow_dispatch:

env:
  XCODE_VERSION: "27.1"
  IOS_VERSION: "27.0"
  SIMULATOR_NAME: "iPhone 17"
  NSUnbufferedIO: "YES"

concurrency:
  group: "unit-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: xcode-27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [no-simulator, simulator-first]
    name: Resolve packages (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Boot the simulator and wait (simulator-first only)
        if: matrix.mode == 'simulator-first'
        uses: ./.github/actions/prepare-simulator
        with:
          ios-version: ${{ env.IOS_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Machine load before resolving
        run: |
          uptime
          # Two samples a second apart: the first top sample always reports 0% CPU.
          top -l 2 -s 1 -n 10 -o cpu -stats pid,command,cpu,mem | tail -n 11 || true
          echo "Spotlight indexing: $(mdutil -s / 2>/dev/null | tail -n 1)"
          ps -Ao pcpu,pmem,comm -r | head -n 12 || true

      - name: xcodebuild -resolvePackageDependencies (cold)
        run: |
          set -o pipefail
          START=$(date +%s)
          xcodebuild -resolvePackageDependencies \
            -scheme WMFComponents \
            -project Wikipedia.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            2>&1 | grep --line-buffered -v -E "DVTAssertions|SimDevice native architecture|^Object:|^Method:|^Thread:|feedbackassistant|^\)$|^$" \
            | while IFS= read -r line; do printf '%s +%ss %s\n' "$(date +%T)" "$(( $(date +%s) - START ))" "${line}"; done
          echo "xcodebuild resolve took $(( $(date +%s) - START ))s"

      - name: Machine load after resolving
        run: |
          uptime
          # Two samples a second apart: the first top sample always reports 0% CPU.
          top -l 2 -s 1 -n 10 -o cpu -stats pid,command,cpu,mem | tail -n 11 || true
          echo "Spotlight indexing: $(mdutil -s / 2>/dev/null | tail -n 1)"
          ps -Ao pcpu,pmem,comm -r | head -n 12 || true
