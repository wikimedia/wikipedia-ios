name: Strict Concurrency Check

# Swift 6 migration guard.
#
# This workflow builds the migration targets with SWIFT_STRICT_CONCURRENCY=complete
# and reports the number of concurrency warnings per scheme. Every one of these
# warnings becomes a hard ERROR once the target flips to Swift 6 language mode, so
# this is the burn-down metric for the migration (see the Swift 6.2 migration plan).
#
# Schemes still burning down their backlog are report-only.
# As each scheme reaches zero, move it into GATED_SCHEMES below to make it a hard gate:
# the job then fails if ANY concurrency warning appears in that scheme's own sources.
# WMFComponents reached zero via default MainActor isolation. WMFData reached zero
# via Sendable services/models and lock-isolated singleton state (started at ~127).
# Both are gated. WMF (the legacy WMF Framework target) is report-only while its
# burn-down runs (it could not even build under complete checking before the
# burn-down began; the first measurable count was ~517, ~224 after the first
# pass). The app targets follow it.

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

env:
  XCODE_VERSION: "26.5"
  IOS_VERSION: "26.5"
  SIMULATOR_NAME: "iPhone 17"
  # Schemes that have completed their strict-concurrency burn-down. For these, the
  # job FAILS if any concurrency warning appears in the scheme's own sources.
  # (Concurrency-scoped on purpose: blanket warnings-as-errors would also trip on
  # unrelated warnings like deprecations.) Space-separated.
  GATED_SCHEMES: "WMFData WMFComponents"

concurrency:
  group: "strict-concurrency-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  strict-concurrency:
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Leaf-first migration order. Add Wikipedia here when it begins its burn-down.
        # WMF (WMF Framework) is report-only while its backlog burns down.
        scheme: ["WMFData", "WMFComponents", "WMF"]

    name: Strict concurrency (${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          ios-version: ${{ env.IOS_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Build ${{ matrix.scheme }} with strict concurrency
        run: |
          SCHEME="${{ matrix.scheme }}"
          echo "Building ${SCHEME} with SWIFT_STRICT_CONCURRENCY=complete"

          GATED="NO"
          for gated in ${GATED_SCHEMES}; do
            if [ "${gated}" = "${SCHEME}" ]; then
              GATED="YES"
            fi
          done

          set -o pipefail
          xcodebuild build \
            -scheme "${SCHEME}" \
            -project Wikipedia.xcodeproj \
            -destination "${{ steps.simulator.outputs.destination }}" \
            SWIFT_STRICT_CONCURRENCY=complete \
            2>&1 | tee "${SCHEME}_strict.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "${BUILD_EXIT}" -ne 0 ]; then
            echo "::error::${SCHEME} failed to build."
            exit "${BUILD_EXIT}"
          fi

          # Count concurrency-related warnings in this scheme's OWN sources only.
          # A scheme's build also compiles its dependencies (e.g. building
          # WMFComponents recompiles WMFData), whose warnings must not be attributed
          # to this scheme. The pattern matches the strict-concurrency diagnostic
          # vocabulary; plain warnings (deprecations etc.) are not counted.
          #
          # Each scheme's sources live under a different path shape: SPM packages
          # use <Package>/Sources, while the WMF framework target compiles from
          # "WMF Framework/" (vendored Third Party code is excluded from its count).
          case "${SCHEME}" in
            WMF) SOURCE_PATH="WMF Framework/" ;;
            *)   SOURCE_PATH="${SCHEME}/Sources" ;;
          esac
          CONCURRENCY_PATTERN='[Ss]endable|concurren|actor|isolat|data race|main actor|nonisolated'
          # Grep once; every stage tolerates zero matches. (The job runs under
          # bash -e with pipefail, so an unguarded empty grep pipeline would
          # fail the step exactly when a gated scheme is clean.)
          MATCHES=$(grep "warning:" "${SCHEME}_strict.log" \
            | grep "${SOURCE_PATH}" \
            | grep -v "WMF Framework/Third Party" \
            | grep -iE "${CONCURRENCY_PATTERN}" || true)
          if [ -n "${MATCHES}" ]; then
            COUNT=$(printf '%s\n' "${MATCHES}" | wc -l | tr -d ' ')
          else
            COUNT=0
          fi
          {
            echo "## Strict concurrency: ${SCHEME}"
            echo ""
            echo "**Concurrency warnings in ${SCHEME} sources (errors under Swift 6 language mode): ${COUNT}**"
            echo ""
            if [ "${COUNT}" -gt 0 ]; then
              echo "Top warnings:"
              echo '```'
              printf '%s\n' "${MATCHES}" \
                | sed -E 's/^.*warning:/warning:/' \
                | sort | uniq -c | sort -rn | head -20
              echo '```'
            else
              echo "No concurrency warnings. 🎉"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${GATED}" = "YES" ] && [ "${COUNT}" -gt 0 ]; then
            echo "::error::${SCHEME} is a gated scheme (zero concurrency warnings) and this change introduced ${COUNT}. See the job summary for details."
            exit 1
          fi

          echo "${SCHEME}: ${COUNT} concurrency warning(s) (gated: ${GATED})."
