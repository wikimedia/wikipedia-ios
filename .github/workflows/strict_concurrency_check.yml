name: Strict Concurrency Check

# Swift 6 migration ratchet.
#
# Each job builds one scheme with SWIFT_STRICT_CONCURRENCY=complete and counts the
# concurrency warnings per target with scripts/strict-concurrency-count.sh. The count
# script attributes each warning to the target that compiles the file, not to a folder.
# scripts/strict-concurrency-ratchet.sh then compares each count of the scheme's own
# targets with .github/strict-concurrency-baseline.json:
#   - A count above its baseline fails the job.
#   - A count below its baseline adds a notice. Lower the baseline in the same PR.
# A target at 0 stays at 0. When a target flips to Swift 6 language mode, its
# warnings become errors and the build itself enforces the rule.

on:
  pull_request:
    branches:
      - 'main'
      - 'release-candidate/**'
      - 'hotfix/**'
  workflow_dispatch:

env:
  XCODE_VERSION: "27.1"
  IOS_VERSION: "27.0"
  SIMULATOR_NAME: "iPhone 17"
  BASELINE_FILE: ".github/strict-concurrency-baseline.json"

concurrency:
  group: "strict-concurrency-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  strict-concurrency:
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Leaf-first migration order. "targets" are the targets that this scheme owns.
        # The Wikipedia scheme also builds the extensions, so its job checks them too.
        include:
          - scheme: "WMFData"
            targets: "WMFData"
          - scheme: "WMFComponents"
            targets: "WMFComponents"
          - scheme: "WMFTestKitchen"
            targets: "WMFTestKitchen"
          - scheme: "WMF"
            targets: "WMF"
          - scheme: "Wikipedia"
            targets: "Wikipedia WidgetsExtension NotificationServiceExtension ContinueReadingWidget"

    name: Strict concurrency (${{ matrix.scheme }})
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Prepare simulator
        id: simulator
        uses: ./.github/actions/prepare-simulator
        with:
          ios-version: ${{ env.IOS_VERSION }}
          simulator-name: ${{ env.SIMULATOR_NAME }}

      - name: Build ${{ matrix.scheme }} with strict concurrency
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          echo "Building ${SCHEME} with SWIFT_STRICT_CONCURRENCY=complete"

          # An incremental build shows warnings only for the files that it compiles
          # again, so the count is too low. Always start from an empty DerivedData.
          DERIVED_DATA="${RUNNER_TEMP}/strict-concurrency-dd-${SCHEME}"
          rm -rf "${DERIVED_DATA}"

          # The step runs under bash -e. Turn it off around the pipeline, so that
          # a failed build reaches the error message below.
          set +e
          set -o pipefail
          xcodebuild build \
            -scheme "${SCHEME}" \
            -project Wikipedia.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "${DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA}" \
            SWIFT_STRICT_CONCURRENCY=complete \
            2>&1 | tee "${SCHEME}_strict.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "${BUILD_EXIT}" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" "${SCHEME}_strict.log"; then
            echo "::error::${SCHEME} failed to build with SWIFT_STRICT_CONCURRENCY=complete."
            grep -E "error:" "${SCHEME}_strict.log" | sort -u | head -50 || true
            exit 1
          fi

      - name: Count and compare with the baseline
        env:
          SCHEME: ${{ matrix.scheme }}
          TARGETS: ${{ matrix.targets }}
        run: |
          # Package tasks run in Wikipedia.xcodeproj, so give the root explicitly.
          scripts/strict-concurrency-count.sh --root "${GITHUB_WORKSPACE}" \
            "${SCHEME}_strict.log" > "${SCHEME}_strict_counts.json"

          # TARGETS is a space-separated list. Split it into arguments on purpose.
          # shellcheck disable=SC2086
          scripts/strict-concurrency-ratchet.sh \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --title "Strict concurrency: ${SCHEME}" \
            "${BASELINE_FILE}" \
            "${SCHEME}_strict_counts.json" \
            ${TARGETS}

      - name: Upload counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-concurrency-${{ matrix.scheme }}
          path: ${{ matrix.scheme }}_strict_counts.json
          if-no-files-found: ignore
