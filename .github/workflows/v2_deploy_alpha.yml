name: V2 Deploy Alpha

on:
  # Alpha builds on every merge into main and skips the build when the latest commit is already tagged.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      builder:
        description: 'Where to archive. "variable" follows the ALPHA_BUILDER repository variable; the others override it for this run only, e.g. to try Xcode Cloud from a branch.'
        required: false
        type: choice
        default: variable
        options:
          - variable
          - github
          - xcode-cloud
      lookup_only:
        description: 'Xcode Cloud only: check the API key, workflow and branch can be found, then stop without starting a build. No upload, tag or comments.'
        required: false
        type: boolean
        default: false

# Serialize runs. On the GitHub path the build number is read from the highest
# alphas/ tag at checkout, but that tag is not pushed until the end of the run,
# so two overlapping runs would both compute the same number and App Store
# Connect would reject the second upload as a duplicate. On the Xcode Cloud
# path each run builds the head of main, so overlapping runs would build the
# same commit twice. Either way, one at a time - and GitHub keeps only the
# newest pending run, so a burst of merges collapses into one build of the
# latest commit.
#
# cancel-in-progress stays false deliberately: cancelling a run could kill it
# after the TestFlight upload but before the tag push, leaving the build number
# untagged and the next run colliding with it.
concurrency:
  group: v2-deploy-alpha
  cancel-in-progress: false

env:
  XCODE_VERSION: "27.1"

# Which machine archives the app is chosen by the ALPHA_BUILDER repository
# variable (Settings > Secrets and variables > Actions > Variables):
#
# - unset or "github": build-github archives on a macOS runner, as before.
# - "xcode-cloud": build-xcode-cloud starts the Xcode Cloud "Alpha Build"
#   workflow through the App Store Connect API and waits for it on Linux, so
#   no macOS runner is used. That Xcode Cloud workflow must be manual-start
#   only, so this variable is the one switch between the two paths.
#
# A manual run can override the variable for that run only with the builder
# input, and builds the branch it is run from on either path. See docs/ci.md.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.duplicate_check.outputs.skip }}
      builder: ${{ steps.builder.outputs.builder }}
      lookup_only: ${{ steps.builder.outputs.lookup_only }}

    steps:
      # fetch-depth: 0 is needed for the tag list, but a full clone of this
      # repo is ~1.4GB of pack. blob:none makes it a partial clone - all
      # commits and trees, no historical file contents.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose builder
        id: builder
        env:
          ALPHA_BUILDER: ${{ vars.ALPHA_BUILDER }}
          BUILDER_INPUT: ${{ inputs.builder }}
          LOOKUP_ONLY: ${{ inputs.lookup_only }}
        run: |
          # Push events have no inputs, so they always follow the variable.
          if [ -n "$BUILDER_INPUT" ] && [ "$BUILDER_INPUT" != "variable" ]; then
            ALPHA_BUILDER="$BUILDER_INPUT"
          fi

          case "${ALPHA_BUILDER:-github}" in
            github) BUILDER=github ;;
            xcode-cloud) BUILDER=xcode-cloud ;;
            *)
              echo "::error::ALPHA_BUILDER is '$ALPHA_BUILDER'. Use 'github', 'xcode-cloud', or leave it unset."
              exit 1
              ;;
          esac

          if [ "$LOOKUP_ONLY" = "true" ] && [ "$BUILDER" != "xcode-cloud" ]; then
            echo "::error::lookup_only only applies to the Xcode Cloud path. Set builder to xcode-cloud."
            exit 1
          fi

          echo "builder=$BUILDER" >> $GITHUB_OUTPUT
          echo "lookup_only=${LOOKUP_ONLY:-false}" >> $GITHUB_OUTPUT
          echo "Building ${GITHUB_REF_NAME} with: $BUILDER (lookup only: ${LOOKUP_ONLY:-false})"

      # -------------------------------------------------------
      # Check for duplicate build
      #
      # Xcode Cloud builds whatever the branch points at when the build
      # starts, so check that commit rather than the one this run was
      # triggered by. A lookup-only run builds nothing, so never skips.
      # -------------------------------------------------------
      - name: Check for duplicate build
        id: duplicate_check
        env:
          BUILDER: ${{ steps.builder.outputs.builder }}
          LOOKUP_ONLY: ${{ steps.builder.outputs.lookup_only }}
        run: |
          if [ "$LOOKUP_ONLY" = "true" ]; then
            echo "Lookup only, not checking for a duplicate"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$BUILDER" = "xcode-cloud" ]; then
            LATEST_COMMIT=$(git rev-parse "origin/${GITHUB_REF_NAME}")
          else
            LATEST_COMMIT=$(git rev-parse HEAD)
          fi
          EXISTING_TAG=$(git tag --points-at $LATEST_COMMIT | grep 'alphas/' | head -1)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Commit $LATEST_COMMIT already has tag $EXISTING_TAG, skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No existing alpha tag for this commit, proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-github:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.builder == 'github'
    runs-on: xcode-27

    steps:
      # fetch-depth: 0 is needed for the tag list and the PR lookback, but
      # a full clone of this repo is ~1.4GB of pack. blob:none makes it a
      # partial clone - all commits and trees, no historical file contents -
      # and git fetches the blobs it actually needs on demand. Nothing here
      # reads old file contents: the tag and branch lookups are refs, the PR
      # lookback is commit metadata, and only the checked-out commit needs
      # real files. Measured on design review: 71s checkout down to 15s.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 0. Fail fast if the bot token is missing
      #
      #    Pushes below use wmf-apps-ci. If the secret resolves empty the
      #    push URL still looks valid but carries no credentials, and the
      #    push is rejected as "a GitHub App" - GITHUB_TOKEN, which cannot
      #    push a ref touching .github/workflows. That only surfaces after
      #    the build has already uploaded, so check it up front instead.
      # -------------------------------------------------------
      - name: Check bot token is available
        env:
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          if [ -z "$APPS_BOT_TOKEN" ]; then
            echo "::error::APPS_BOT_TOKEN is empty or not available to this run. Tags and branches cannot be pushed as wmf-apps-ci, and falling back to GITHUB_TOKEN would be rejected. Check the repository secret."
            exit 1
          fi
          echo "APPS_BOT_TOKEN is present"

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # -------------------------------------------------------
      # 1. Compute build number
      # -------------------------------------------------------
      - name: Compute build number
        id: versioning
        run: |
          VERSION=$(date -u "+%Y.%m.%d")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          LATEST=$(git tag --list 'alphas/*' \
            | sed 's|alphas/||' \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -1)
          BUILD=$(( ${LATEST:-0} + 1 ))
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD"

      # -------------------------------------------------------
      # 2. What to Test notes and the Phabricator tasks to comment on
      # -------------------------------------------------------
      - name: Release notes
        id: notes
        uses: ./.github/actions/alpha-release-notes
        with:
          sha: ${{ github.sha }}
          version: ${{ steps.versioning.outputs.version }}
          build: ${{ steps.versioning.outputs.build }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 3. Update version and build number in Info.plist files
      # -------------------------------------------------------
      - name: Update version and build number
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          PLISTS=(
            "WMF Framework/Info.plist"
            "Wikipedia Stickers/Info.plist"
            "Wikipedia/Experimental-Info.plist"
            "Wikipedia/Local-Info.plist"
            "Wikipedia/Alpha-Info.plist"
            "Wikipedia/Wikipedia-Info.plist"
            "ContinueReadingWidget/Info.plist"
            "WikipediaUnitTests/Info.plist"
            "Widgets/Info.plist"
            "NotificationServiceExtension/Info.plist"
          )

          for PLIST in "${PLISTS[@]}"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          done

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "Wikipedia/Alpha-Info.plist"

          echo "Updated CFBundleShortVersionString to $VERSION and CFBundleVersion to $BUILD"

      # -------------------------------------------------------
      # 4. Build the Alpha app and upload to TestFlight (internal)
      # -------------------------------------------------------
      - name: Install fastlane
        run: bundle install

      - name: Write App Store API Key
        run: |
          mkdir -p ~/.appstore
          echo "${{ secrets.APP_STORE_API_KEY }}" > ~/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          echo "APP_STORE_KEY_PATH=$HOME/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8" >> $GITHUB_ENV

      - name: Build and upload to internal TestFlight
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          WHAT_TO_TEST_PATH: ${{ steps.notes.outputs.what_to_test_path }}
        run: |
          bundle exec fastlane alpha

      # -------------------------------------------------------
      # 5. Tag the build
      # -------------------------------------------------------
      - name: Tag build
        env:
          BUILD: ${{ steps.versioning.outputs.build }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "alphas/$BUILD"
          # Push as wmf-apps-ci like our other automated repo writes;
          # GITHUB_TOKEN cannot push a ref whose tree touches .github/workflows/**.
          # The -c clears the AUTHORIZATION header actions/checkout leaves
          # configured for github.com, so the URL's credentials are the only
          # ones in play. Belt and braces: on 2026-10-07 a branch push with
          # this same URL was still rejected as "a GitHub App" and started
          # working once the -c was added, but a tag push had already
          # succeeded without it, so the mechanism is not fully understood.
          git -c http.https://github.com/.extraheader= push https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} "alphas/$BUILD"

      # -------------------------------------------------------
      # 6. Post to Phabricator tasks
      # -------------------------------------------------------
      - name: Post to Phabricator tasks
        uses: ./.github/actions/alpha-phabricator-comments
        with:
          phab-token: ${{ secrets.PHAB_BOT_API_KEY }}
          phab-task-urls: ${{ steps.notes.outputs.phab_task_urls }}
          version: ${{ steps.versioning.outputs.version }}
          build: ${{ steps.versioning.outputs.build }}

  # Archives on Xcode Cloud. Everything in this job is API calls and git, so
  # it runs on Linux and never takes a macOS runner.
  #
  # Xcode Cloud owns the version (the UTC date) and build number
  # (CI_BUILD_NUMBER) and pushes the alphas/ tag itself, before its
  # TestFlight upload - see ci_scripts/ci_pre_xcodebuild.sh and
  # ci_scripts/tag_script_xcodebuild.sh. This job reports what was built,
  # then sets the notes and comments on Phabricator.
  #
  # Runs from any branch: the Xcode Cloud build is started on the branch
  # the run was dispatched from (main for merges).
  #
  # If this run is cancelled mid-wait the Xcode Cloud build carries on and
  # still uploads and tags; only the notes and Phabricator comments are lost.
  build-xcode-cloud:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.builder == 'xcode-cloud'
    runs-on: ubuntu-latest
    # Up to 90 minutes for the Xcode Cloud build, 15 for the TestFlight
    # build to appear and 45 for it to finish processing.
    timeout-minutes: 160
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      # Uses the runner's preinstalled Ruby: the organisation only allows
      # actions owned by wikimedia or GitHub, which rules out
      # ruby/setup-ruby. A plain bundle install re-resolves the way the
      # macOS jobs' does (the locked CFPropertyList needs Ruby < 3.2, so a
      # frozen install would fail), into the workspace because the system
      # gem directory needs sudo.
      - name: Install fastlane
        run: |
          ruby -v
          bundle install

      - name: Build on Xcode Cloud
        id: xcode_cloud
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          BRANCH: ${{ github.ref_name }}
          XCODE_CLOUD_LOOKUP_ONLY: ${{ needs.prepare.outputs.lookup_only }}
        run: bundle exec fastlane xcode_cloud_alpha

      # The branch may have moved since checkout, and Xcode Cloud has pushed
      # its tag; fetch both so the notes can walk back from the built commit.
      - name: Fetch the built commit
        if: needs.prepare.outputs.lookup_only != 'true'
        env:
          SHA: ${{ steps.xcode_cloud.outputs.sha }}
        run: |
          git fetch --filter=blob:none --tags origin "${GITHUB_REF_NAME}"
          git cat-file -e "$SHA^{commit}"

      - name: Release notes
        if: needs.prepare.outputs.lookup_only != 'true'
        id: notes
        uses: ./.github/actions/alpha-release-notes
        with:
          sha: ${{ steps.xcode_cloud.outputs.sha }}
          version: ${{ steps.xcode_cloud.outputs.version }}
          build: ${{ steps.xcode_cloud.outputs.build }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set What to Test in TestFlight
        if: needs.prepare.outputs.lookup_only != 'true'
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          BUILD_ID: ${{ steps.xcode_cloud.outputs.build_id }}
          WHAT_TO_TEST_PATH: ${{ steps.notes.outputs.what_to_test_path }}
        run: bundle exec fastlane alpha_what_to_test

      - name: Post to Phabricator tasks
        if: needs.prepare.outputs.lookup_only != 'true'
        uses: ./.github/actions/alpha-phabricator-comments
        with:
          phab-token: ${{ secrets.PHAB_BOT_API_KEY }}
          phab-task-urls: ${{ steps.notes.outputs.phab_task_urls }}
          version: ${{ steps.xcode_cloud.outputs.version }}
          build: ${{ steps.xcode_cloud.outputs.build }}
