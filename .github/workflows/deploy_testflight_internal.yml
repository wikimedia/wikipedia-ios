name: Internal TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for git diff
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 1. Figure out version + build number
      # -------------------------------------------------------
      - name: Compute build number
        id: versioning
        run: |
          # Read version from Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            Wikipedia/Wikipedia-Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Find latest betas/XXXX tag and increment
          LATEST=$(git tag --list 'betas/*' \
            | sed 's|betas/||' \
            | sort -n \
            | tail -1)
          BUILD=$(( ${LATEST:-0} + 1 ))
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD"

      # -------------------------------------------------------
      # 2. Find new PRs since last release tag
      # -------------------------------------------------------
      - name: Find new PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess
          import re
          import os

          # Find latest releases/X.Y.Z tag
          result = subprocess.run(
            ['git', 'tag', '--list', 'releases/*', '--sort=-version:refname'],
            capture_output=True, text=True
          )
          tags = result.stdout.strip().split('\n')
          last_release_tag = next((t for t in tags if t), None)

          if not last_release_tag:
            print("No release tag found, skipping PR lookup")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("pr_numbers=\n")
            exit(0)

          print(f"Last release tag: {last_release_tag}")

          # Get merge commits since that tag
          result = subprocess.run(
            ['git', 'log', '--oneline', '--merges', f'{last_release_tag}..HEAD'],
            capture_output=True, text=True
          )
          commits = result.stdout.strip().split('\n')

          # Extract PR numbers from commit messages like:
          # "Merge pull request #5990 from wikimedia/home-settings-fix"
          pr_numbers = []
          for commit in commits:
            match = re.search(r'Merge pull request #(\d+)', commit)
            if match:
              pr_numbers.append(match.group(1))

          print(f"Found PRs: {pr_numbers}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"pr_numbers={','.join(pr_numbers)}\n")
            f.write(f"last_release_tag={last_release_tag}\n")
          EOF

      # -------------------------------------------------------
      # 3. Fetch Phabricator tasks from PR descriptions
      # -------------------------------------------------------
      - name: Fetch Phabricator tasks from PRs
        id: phab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ steps.prs.outputs.pr_numbers }}
        run: |
          python3 << 'EOF'
          import requests
          import re
          import os

          pr_numbers_str = os.environ.get('PR_NUMBERS', '')
          if not pr_numbers_str:
            print("No PRs found, skipping Phabricator lookup")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("phab_tasks=\n")
              f.write("phab_task_urls=\n")
            exit(0)

          pr_numbers = [p for p in pr_numbers_str.split(',') if p]
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'token {token}'}

          phab_tasks = []

          for pr_num in pr_numbers:
            url = f"https://api.github.com/repos/{repo}/pulls/{pr_num}"
            resp = requests.get(url, headers=headers)
            if resp.status_code != 200:
              print(f"Could not fetch PR #{pr_num}")
              continue

            body = resp.json().get('body') or ''

            phab_section = re.findall(
              r'Phabricator:\s*((?:https://phabricator\.wikimedia\.org/T\d+[\s,]*)+)',
              body, re.IGNORECASE
            )

            for section in phab_section:
              urls = re.findall(r'https://phabricator\.wikimedia\.org/T\d+', section)
              phab_tasks.extend(urls)

          # Deduplicate
          phab_tasks = list(dict.fromkeys(phab_tasks))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"phab_task_urls={','.join(phab_tasks)}\n")

          with open('/tmp/phab_tasks.txt', 'w') as f:
            f.write('\n'.join(f'• {t}' for t in phab_tasks))
          EOF

      # -------------------------------------------------------
      # 4. Log what would be used
      # -------------------------------------------------------
      - name: Log dry run results
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
          LAST_RELEASE_TAG: ${{ steps.prs.outputs.last_release_tag }}
          PR_NUMBERS: ${{ steps.prs.outputs.pr_numbers }}
          PHAB_TASK_URLS: ${{ steps.phab.outputs.phab_task_urls }}
        run: |
          echo "==============================="
          echo "DRY RUN — nothing will be uploaded or tagged"
          echo "==============================="
          echo "Version:          $VERSION"
          echo "Build number:     $BUILD"
          echo "Last release tag: $LAST_RELEASE_TAG"
          echo "PRs found:        $PR_NUMBERS"
          echo ""
          echo "Phabricator tasks:"
          cat /tmp/phab_tasks.txt 2>/dev/null || echo "  (none)"
          echo ""
          echo "TestFlight 'What to Test' notes would be:"
          echo "-------------------------------"
          echo "Build: $VERSION ($BUILD)"
          echo "Changes since $LAST_RELEASE_TAG"
          echo ""
          echo "Phabricator Tasks:"
          cat /tmp/phab_tasks.txt 2>/dev/null || echo "  (none)"
          echo "-------------------------------"
