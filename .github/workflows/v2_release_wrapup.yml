name: V2 Release Wrap Up

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Release or hotfix. Picks the branch prefix (release-candidate/ or hotfix/) and the Phabricator task title to match.'
        required: true
        type: choice
        default: release
        options:
          - release
          - hotfix
      version:
        description: 'Release version (YYYY.MM.DD) that was approved and released'
        required: true
        type: string
      beta_build_number:
        description: 'Build number of the betas/ build that was approved and released'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialize repeats of the same wrap up. The group is keyed by the inputs rather
# than flat, so two genuinely different versions still run in parallel and only a
# double-dispatch of the same one queues behind itself.
concurrency:
  group: v2-release-wrapup-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  wrap-up:
    runs-on: macos-26

    steps:
      # fetch-depth: 0 is needed for the tag list and the PR lookback, but
      # a full clone of this repo is ~1.4GB of pack. blob:none makes it a
      # partial clone - all commits and trees, no historical file contents -
      # and git fetches the blobs it actually needs on demand. Nothing here
      # reads old file contents: the tag and branch lookups are refs, the PR
      # lookback is commit metadata, and only the checked-out commit needs
      # real files. Measured on design review: 71s checkout down to 15s.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 0. Fail fast if the bot token is missing
      #
      #    Pushes below use wmf-apps-ci. If the secret resolves empty the
      #    push URL still looks valid but carries no credentials, and the
      #    push is rejected as "a GitHub App" - GITHUB_TOKEN, which cannot
      #    push a ref touching .github/workflows. That only surfaces after
      #    the build has already uploaded, so check it up front instead.
      # -------------------------------------------------------
      - name: Check bot token is available
        env:
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          if [ -z "$APPS_BOT_TOKEN" ]; then
            echo "::error::APPS_BOT_TOKEN is empty or not available to this run. Tags and branches cannot be pushed as wmf-apps-ci, and falling back to GITHUB_TOKEN would be rejected. Check the repository secret."
            exit 1
          fi
          echo "APPS_BOT_TOKEN is present"

      # -------------------------------------------------------
      # 1. Resolve the commit that was released
      # -------------------------------------------------------
      - name: Resolve released commit
        id: resolve
        env:
          BETA_BUILD_NUMBER: ${{ github.event.inputs.beta_build_number }}
        run: |
          SHA=$(git rev-parse "refs/tags/betas/$BETA_BUILD_NUMBER")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Released commit: $SHA (betas/$BETA_BUILD_NUMBER)"

      # -------------------------------------------------------
      # 2. Create release tag
      # -------------------------------------------------------
      - name: Create release tag
        env:
          VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          # Idempotent on purpose: if a later step failed, a re-run has to get
          # past here. Checks the remote rather than the local tag list, since
          # the checkout may not have fetched a tag pushed by an earlier run.
          if git ls-remote --exit-code --tags origin "refs/tags/releases/$VERSION" >/dev/null 2>&1; then
            echo "::warning::releases/$VERSION already exists - skipping tag creation"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "releases/$VERSION" "$SHA"
          # Push as wmf-apps-ci like our other automated repo writes;
          # GITHUB_TOKEN cannot push a ref whose tree touches .github/workflows/**.
          # The -c clears the AUTHORIZATION header actions/checkout leaves
          # configured for github.com, so the URL's credentials are the only
          # ones in play. Belt and braces: on 2026-10-07 a branch push with
          # this same URL was still rejected as "a GitHub App" and started
          # working once the -c was added, but a tag push had already
          # succeeded without it, so the mechanism is not fully understood.
          git -c http.https://github.com/.extraheader= push https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} "releases/$VERSION"
          echo "Created releases/$VERSION at $SHA"

      # -------------------------------------------------------
      # 3. Create GitHub Release
      # -------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          BUILD: ${{ github.event.inputs.beta_build_number }}
        run: |
          if gh release view "releases/$VERSION" >/dev/null 2>&1; then
            echo "::warning::GitHub Release releases/$VERSION already exists - skipping"
            exit 0
          fi

          gh release create "releases/$VERSION" \
            --title "Release $VERSION" \
            --notes "Wikipedia iOS $VERSION ($BUILD)"

      # -------------------------------------------------------
      # 4. Update release task with final info
      # -------------------------------------------------------
      - name: Update release task with final info
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          VERSION: ${{ github.event.inputs.version }}
          KIND: ${{ github.event.inputs.kind }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import os
          from datetime import datetime, timezone

          token = os.environ['PHAB_TOKEN']
          version = os.environ['VERSION']
          # A hotfix task is titled "Hotfix <version>"; see V2 Deploy Hotfix for why.
          label = 'Hotfix' if os.environ.get('KIND') == 'hotfix' else 'Release'
          sha = os.environ['SHA']
          release_tag = f"releases/{version}"
          release_date = datetime.now(timezone.utc).strftime('%Y.%m.%d')

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.search',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'constraints[projects][0]': 'PHID-PROJ-ojylfmfiogxrvnxoiwlp',
              'constraints[statuses][0]': 'open',
              'order': 'newest',
              'limit': '100',
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read())

          tasks = data.get('result', {}).get('data', [])
          release_task = next(
            (t for t in tasks if t.get('fields', {}).get('name', '') == f"{label} {version}"),
            None
          )

          if not release_task:
            print(f"No open task titled '{label} {version}' found, skipping")
            exit(0)

          task_phid = release_task['phid']
          description = release_task.get('fields', {}).get('description', {}).get('raw', '')

          def set_field(description, field, value):
            pattern = re.compile(rf'(\*\*{re.escape(field)}\*\*:).*')
            if pattern.search(description):
              return pattern.sub(rf'\1 {value}', description, count=1)
            insertion = f"**{field}**: {value}"
            if '**Included Tasks:**' in description:
              before, marker, after = description.partition('**Included Tasks:**')
              return before.rstrip() + "\n" + insertion + "\n\n" + marker + after
            return description.rstrip() + f"\n\n{insertion}"

          description = set_field(description, 'Release tag', release_tag)
          description = set_field(description, 'Release SHA1', sha)
          description = set_field(description, 'App Store Release Date', release_date)

          req = urllib.request.Request(
            'https://phabricator.wikimedia.org/api/maniphest.edit',
            headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
            data=urllib.parse.urlencode({
              'api.token': token,
              'objectIdentifier': task_phid,
              'transactions[0][type]': 'description',
              'transactions[0][value]': description,
            }).encode()
          )

          with urllib.request.urlopen(req) as resp:
            result = json.loads(resp.read())
            if not result.get('error_code'):
              print(f"✓ Updated release task with tag {release_tag}, SHA {sha}, release date {release_date}")
            else:
              print(f"✗ Failed to update release task: {result.get('error_info')}")
          EOF

      # -------------------------------------------------------
      # 5. Check release branch for unmerged changes
      # -------------------------------------------------------
      - name: Check release branch for unmerged changes
        id: check_branch
        env:
          VERSION: ${{ github.event.inputs.version }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          python3 << 'EOF'
          import os
          import re
          import subprocess

          version = os.environ['VERSION']
          kind = os.environ.get('KIND') or 'release'
          branch = f"hotfix/{version}" if kind == 'hotfix' else f"release-candidate/{version}"

          def git(*args):
            return subprocess.run(['git', *args], capture_output=True, text=True)

          def out(**kw):
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in kw.items():
                f.write(f"{k}={v}\n")

          def describe(sha):
            return git('log', '-1', '--format=%h %s', sha).stdout.strip()

          def unmerged(target, head):
            """Commits on head whose change is not already present on target.

            git cherry compares patch ids, so a clean cherry-pick is recognised
            even though its sha differs - which plain rev-list would not do, and
            a hotfix is all cherry-picks. A pick that needed conflict resolution
            has a different patch id and would look new, so fall back to the
            "(cherry picked from commit ...)" trailer that -x records and ask
            whether that original is on the target instead. Without a trailer
            there is no way to tell a genuinely new commit from a resolved pick,
            so it counts as missing and is reported as unverified.
            """
            res = git('cherry', target, head)
            if res.returncode != 0:
              return None, None
            missing, unverified = [], []
            for line in res.stdout.splitlines():
              mark, _, sha = line.partition(' ')
              sha = sha.strip()
              if mark == '-':
                continue
              body = git('log', '-1', '--format=%B', sha).stdout
              m = re.search(r'^\(cherry picked from commit ([0-9a-f]{7,40})\)\s*$', body, re.M)
              if m:
                probe = git('merge-base', '--is-ancestor', m.group(1), target)
                if probe.returncode == 0:
                  continue
                if probe.returncode > 1:
                  unverified.append(sha)
              else:
                unverified.append(sha)
              missing.append(sha)
            return missing, unverified

          out(branch=branch)

          # A completed run deletes this branch in step 7, so a re-run finds it
          # gone. That means the cycle was already cleaned up, not that anything
          # is wrong - skip the merge-back check instead of failing the fetch.
          if git('ls-remote', '--exit-code', '--heads', 'origin', branch).returncode != 0:
            print(f"::warning::{branch} no longer exists - already cleaned up, skipping steps 6 and 7")
            out(branch_exists='false', new_commits='0')
            raise SystemExit(0)

          out(branch_exists='true')
          git('fetch', 'origin', '--prune', '+refs/heads/*:refs/remotes/origin/*')

          missing, unverified = unmerged('origin/main', f'origin/{branch}')
          if missing is None:
            print(f"::warning::Could not compare {branch} against main, assuming nothing to merge back")
            out(new_commits='0')
            raise SystemExit(0)

          print(f"{branch} has {len(missing)} commit(s) whose change is not on main")
          for sha in missing:
            print(f"  {describe(sha)}")
          if unverified:
            print(f"  ({len(unverified)} of those carry no 'cherry picked from' trailer - either new work "
                  f"written here, or a pick made without -x. Picking with -x removes the ambiguity.)")
          out(new_commits=len(missing))
          EOF

      # -------------------------------------------------------
      # 6. Open a PR for any changes not yet on main
      # -------------------------------------------------------
      - name: Open PR for unmerged release branch changes
        if: steps.check_branch.outputs.branch_exists == 'true' && steps.check_branch.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          BRANCH: ${{ steps.check_branch.outputs.branch }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "::warning::A PR from $BRANCH into main is already open - skipping"
            exit 0
          fi

          # On a hotfix these commits are the cherry-picked fix itself, so this
          # PR is the expected end of the cycle. On a release they mean someone
          # committed to the release branch after it was cut, which is not.
          if [ "$KIND" = "hotfix" ]; then
            LABEL="Hotfix"
            WHY="These are the fixes that were cherry-picked onto the hotfix branch."
          else
            LABEL="Release"
            WHY="These are changes that landed on the release branch after it was cut."
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Merge $BRANCH back to main" \
            --body "$LABEL $VERSION shipped with changes on $BRANCH that aren't on main yet. $WHY This PR brings them back."
          echo "Opened PR to merge $BRANCH into main - branch left in place until it merges"

      # -------------------------------------------------------
      # 7. Delete release branch (only if nothing to merge back)
      # -------------------------------------------------------
      - name: Delete release branch
        if: steps.check_branch.outputs.branch_exists == 'true' && steps.check_branch.outputs.new_commits == '0'
        env:
          BRANCH: ${{ steps.check_branch.outputs.branch }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          # Delete as wmf-apps-ci, not as github-actions[bot]. release-candidate/**
          # is protected with "Restrict who can push", and the allowlist is
          # wmf-apps-ci plus org/repo admins and Maintain - "Allow deletions"
          # grants deletion to those same actors, so a plain `git push origin
          # --delete` using the GITHUB_TOKEN credentials actions/checkout left
          # configured would be rejected. This also matches how every other repo
          # write in these workflows is made.
          git -c http.https://github.com/.extraheader= push https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} --delete "$BRANCH"
          echo "Deleted $BRANCH"
