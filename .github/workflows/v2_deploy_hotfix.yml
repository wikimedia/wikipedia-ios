name: V2 Deploy Hotfix

# Builds a hotfix from an existing hotfix/ branch and uploads it to internal
# TestFlight. Cut the branch with V2 Cut Hotfix Branch first, then cherry-pick
# onto it with -x.
#
# Internal distribution on purpose: external TestFlight needs Apple's beta
# review, which is a bad dependency when you are fixing something urgent, and
# a release candidate's betas are usually flowing to external testers at the
# same time - a second version train there only confuses them.
#
# The Phabricator task is titled "Hotfix <version>", never "Release <version>",
# because V2 Deploy Beta refuses to run when it sees more than one open task
# matching ^Release. Titling it anything else keeps an in-flight release
# candidate working while a hotfix ships.

#
# Where the app is archived is chosen by the RELEASE_BUILDER repository
# variable, shared with V2 Deploy Beta because both build the production app
# from the same Xcode Cloud workflow and build counter:
#
# - unset or "xcode-cloud" (the default): the job runs on Linux and starts the
#   Xcode Cloud "Beta Build" workflow on the hotfix branch through the App
#   Store Connect API, so no macOS runner is used. Xcode Cloud sets the
#   version (from the branch name) and build number, uploads to internal
#   TestFlight and pushes the betas/ tag.
# - "github": the fallback. The job runs on a macOS runner and archives here.
#
# The builder input overrides the variable for one run. See docs/ci.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYYY.MM.DD) of the hotfix branch to build, as created by V2 Cut Hotfix Branch'
        required: true
        type: string
      builder:
        description: 'Where to archive. "variable" follows the RELEASE_BUILDER repository variable; the others override it for this run only.'
        required: false
        type: choice
        default: variable
        options:
          - variable
          - xcode-cloud
          - github
      lookup_only:
        description: 'Xcode Cloud only: check the API key, workflow and hotfix branch can be found, then stop without starting a build. No upload, tag or task.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Shares V2 Deploy Beta's group rather than having its own. Both take the next
# betas/ number, and a release candidate is normally building betas during the
# window a hotfix is being shipped - overlapping runs would compute the same
# build number and App Store Connect would reject the second upload.
concurrency:
  group: v2-deploy-beta
  cancel-in-progress: false

env:
  XCODE_VERSION: "27.1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.builder.outputs.builder }}
      lookup_only: ${{ steps.builder.outputs.lookup_only }}
    steps:
      - name: Choose builder
        id: builder
        env:
          RELEASE_BUILDER: ${{ vars.RELEASE_BUILDER }}
          BUILDER_INPUT: ${{ inputs.builder }}
          LOOKUP_ONLY: ${{ inputs.lookup_only }}
        run: |
          if [ -n "$BUILDER_INPUT" ] && [ "$BUILDER_INPUT" != "variable" ]; then
            RELEASE_BUILDER="$BUILDER_INPUT"
          fi

          case "${RELEASE_BUILDER:-xcode-cloud}" in
            github) BUILDER=github ;;
            xcode-cloud) BUILDER=xcode-cloud ;;
            *)
              echo "::error::RELEASE_BUILDER is '$RELEASE_BUILDER'. Use 'xcode-cloud', 'github', or leave it unset."
              exit 1
              ;;
          esac

          if [ "$LOOKUP_ONLY" = "true" ] && [ "$BUILDER" != "xcode-cloud" ]; then
            echo "::error::lookup_only only applies to the Xcode Cloud path. Set builder to xcode-cloud."
            exit 1
          fi

          echo "builder=$BUILDER" >> $GITHUB_OUTPUT
          echo "lookup_only=${LOOKUP_ONLY:-false}" >> $GITHUB_OUTPUT
          echo "Building with: $BUILDER (lookup only: ${LOOKUP_ONLY:-false})"

  # One job for both paths: everything but the archive is git, Python and
  # curl, so it runs on whichever machine the builder needs. Steps only one
  # path needs say so in their if.
  build-and-upload:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.builder == 'xcode-cloud' && 'ubuntu-latest' || 'macos-26' }}
    # Xcode Cloud: up to 90 minutes for the build, 15 for the TestFlight
    # build to appear and 45 for it to finish processing.
    timeout-minutes: ${{ needs.prepare.outputs.builder == 'xcode-cloud' && 160 || 360 }}
    env:
      XCODE_CLOUD: ${{ needs.prepare.outputs.builder == 'xcode-cloud' }}
      LOOKUP_ONLY: ${{ needs.prepare.outputs.lookup_only }}

    steps:
      # Only the Mac path pushes anything; on Xcode Cloud the tag is pushed by
      # Xcode Cloud with its own copy of the token.
      - name: Check bot token is available
        if: env.XCODE_CLOUD != 'true'
        env:
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          if [ -z "$APPS_BOT_TOKEN" ]; then
            echo "::error::APPS_BOT_TOKEN is not available to this run. The build tag could not be pushed."
            exit 1
          fi
          echo "APPS_BOT_TOKEN is present"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        if: env.XCODE_CLOUD != 'true'
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Check out the hotfix branch
        id: branch
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          BRANCH="hotfix/$VERSION"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          if ! git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1; then
            echo "::error::$BRANCH does not exist. Dispatch V2 Cut Hotfix Branch first, then cherry-pick onto it."
            exit 1
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"

          # The nearest releases/ tag reachable from here is what the branch was
          # cut from, whatever has happened to the tag list since.
          BASE_TAG=$(git describe --tags --abbrev=0 --match 'releases/*' HEAD)
          COUNT=$(git rev-list --count "$BASE_TAG..HEAD")

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$BRANCH has no commits beyond $BASE_TAG. Merge a PR carrying the cherry-picked fix into it before building."
            exit 1
          fi

          echo "Branch   : $BRANCH at $(git rev-parse HEAD)"
          echo "Cut from : $BASE_TAG"
          echo "Carrying : $COUNT commit(s)"
          git log --oneline "$BASE_TAG..HEAD" | sed 's/^/  /'

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT

      # Uses the runner's preinstalled Ruby (the organisation only allows
      # actions owned by wikimedia or GitHub, which rules out
      # ruby/setup-ruby). It ships without the bundle command, so install the
      # locked Bundler into the user gem directory first. A plain bundle
      # install re-resolves the way the Mac job's does.
      - name: Install Bundler
        if: env.XCODE_CLOUD == 'true'
        run: |
          ruby -v
          gem install --user-install --no-document bundler -v "$(tail -1 Gemfile.lock | tr -d ' ')"
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install fastlane on Linux
        if: env.XCODE_CLOUD == 'true'
        env:
          BUNDLE_PATH: vendor/bundle
        run: bundle install

      # Xcode Cloud builds whatever the branch points at when it starts, takes
      # the version from the branch name (ci_scripts/ci_pre_xcodebuild.sh)
      # and its own build number, uploads to internal TestFlight and pushes
      # betas/<build>. The lane checks the version came out as asked.
      - name: Build on Xcode Cloud
        id: xcode_cloud
        if: env.XCODE_CLOUD == 'true'
        env:
          BUNDLE_PATH: vendor/bundle
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          EXPECTED_VERSION: ${{ github.event.inputs.version }}
          XCODE_CLOUD_LOOKUP_ONLY: ${{ env.LOOKUP_ONLY }}
          # Lanes run inside fastlane/, so this has to be absolute.
          XCODE_CLOUD_LOGS_DIR: ${{ github.workspace }}/xcode-cloud-logs
        run: bundle exec fastlane xcode_cloud_release

      # The notes below are read from the checkout, so make it the commit
      # Xcode Cloud built, in case the branch moved since it was checked out.
      - name: Check out the built commit
        if: env.XCODE_CLOUD == 'true' && env.LOOKUP_ONLY != 'true'
        env:
          SHA: ${{ steps.xcode_cloud.outputs.sha }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ "$SHA" != "$(git rev-parse HEAD)" ]; then
            git fetch --filter=blob:none origin "$BRANCH"
            echo "::warning::$BRANCH moved after this run started; Xcode Cloud built $SHA."
            git checkout -q "$SHA"
          fi

      - name: Compute build number
        id: versioning
        if: env.XCODE_CLOUD != 'true'
        run: |
          LATEST=$(git tag --list 'betas/*' \
            | sed 's|betas/||' \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -1)
          BUILD=$(( ${LATEST:-0} + 1 ))
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: ${{ github.event.inputs.version }}, Build: $BUILD"

      - name: Write TestFlight notes
        if: env.LOOKUP_ONLY != 'true'
        env:
          VERSION: ${{ github.event.inputs.version }}
          BUILD: ${{ steps.versioning.outputs.build || steps.xcode_cloud.outputs.build }}
          BASE_TAG: ${{ steps.branch.outputs.base_tag }}
        run: |
          {
            echo "Hotfix $VERSION ($BUILD)"
            echo
            echo "Changes on top of $BASE_TAG:"
            # --no-merges so a "Merge pull request #N from ..." subject does not
            # end up in the notes testers read. A no-op when the fix was
            # cherry-picked straight onto the branch.
            git log --no-merges --format='- %s' "$BASE_TAG..HEAD"
          } > /tmp/what_to_test.txt

          cat /tmp/what_to_test.txt

      - name: Update version and build number
        if: env.XCODE_CLOUD != 'true'
        env:
          VERSION: ${{ github.event.inputs.version }}
          BUILD: ${{ steps.versioning.outputs.build }}
        run: |
          PLISTS=(
            "WMF Framework/Info.plist"
            "Wikipedia Stickers/Info.plist"
            "Wikipedia/Experimental-Info.plist"
            "Wikipedia/Local-Info.plist"
            "Wikipedia/Alpha-Info.plist"
            "Wikipedia/Wikipedia-Info.plist"
            "ContinueReadingWidget/Info.plist"
            "WikipediaUnitTests/Info.plist"
            "Widgets/Info.plist"
            "NotificationServiceExtension/Info.plist"
          )

          for PLIST in "${PLISTS[@]}"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          done

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "Wikipedia/Wikipedia-Info.plist"

          echo "Updated CFBundleShortVersionString to $VERSION and CFBundleVersion to $BUILD"

      - name: Install fastlane
        if: env.XCODE_CLOUD != 'true'
        run: bundle install

      - name: Write App Store API Key
        if: env.XCODE_CLOUD != 'true'
        run: |
          mkdir -p ~/.appstore
          echo "${{ secrets.APP_STORE_API_KEY }}" > ~/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          echo "APP_STORE_KEY_PATH=$HOME/.appstore/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8" >> $GITHUB_ENV

      - name: Build and upload to internal TestFlight
        if: env.XCODE_CLOUD != 'true'
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          WHAT_TO_TEST_PATH: /tmp/what_to_test.txt
        run: |
          bundle exec fastlane internal_beta

      - name: Set What to Test in TestFlight
        if: env.XCODE_CLOUD == 'true' && env.LOOKUP_ONLY != 'true'
        env:
          BUNDLE_PATH: vendor/bundle
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          BUILD_ID: ${{ steps.xcode_cloud.outputs.build_id }}
          WHAT_TO_TEST_PATH: /tmp/what_to_test.txt
        run: bundle exec fastlane testflight_what_to_test

      - name: Tag build
        if: env.XCODE_CLOUD != 'true'
        env:
          BUILD: ${{ steps.versioning.outputs.build }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "betas/$BUILD"
          # Pushed as wmf-apps-ci like every other automated write here; the -c
          # clears the AUTHORIZATION header actions/checkout leaves configured.
          git -c http.https://github.com/.extraheader= push https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} "betas/$BUILD"

      - name: Create or update the hotfix task
        if: env.LOOKUP_ONLY != 'true'
        env:
          PHAB_TOKEN: ${{ secrets.PHAB_BOT_API_KEY }}
          VERSION: ${{ github.event.inputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BUILD: ${{ steps.versioning.outputs.build || steps.xcode_cloud.outputs.build }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import os

          token = os.environ['PHAB_TOKEN']
          version = os.environ['VERSION']
          branch = os.environ['BRANCH']
          build = os.environ['BUILD']

          PROJECT = 'PHID-PROJ-ojylfmfiogxrvnxoiwlp'
          title = f'Hotfix {version}'

          def conduit(method, params):
            req = urllib.request.Request(
              f'https://phabricator.wikimedia.org/api/{method}',
              headers={'User-Agent': 'GitHubPRBot/1.0 (https://phabricator.wikimedia.org/p/GitHubPRBot)'},
              data=urllib.parse.urlencode(params).encode()
            )
            with urllib.request.urlopen(req) as resp:
              return json.loads(resp.read())

          data = conduit('maniphest.search', {
            'api.token': token,
            'constraints[projects][0]': PROJECT,
            'constraints[statuses][0]': 'open',
            'order': 'newest',
            'limit': '100',
          })
          if data.get('error_code'):
            print(f"::error::Could not search Phabricator: {data.get('error_info')}")
            exit(1)

          existing = next(
            (t for t in data.get('result', {}).get('data', [])
             if t.get('fields', {}).get('name', '') == title),
            None
          )

          def set_field(description, field, value):
            pattern = re.compile(rf'(\*\*{re.escape(field)}\*\*:).*')
            if pattern.search(description):
              return pattern.sub(rf'\1 {value}', description, count=1)
            return description.rstrip() + f"\n**{field}**: {value}"

          # Same field names as a release task, so V2 Submit App Store and
          # V2 Release Wrap Up can read and stamp a hotfix task unchanged.
          TEMPLATE = ('**Release version**:\n**Release branch**:\n**Release tag**:\n'
                      '**Release SHA1**:\n**App Store Submission Date**:\n'
                      '**App Store Release Date**:')

          description = existing.get('fields', {}).get('description', {}).get('raw', '') if existing else TEMPLATE
          description = set_field(description, 'Release version', version)
          description = set_field(description, 'Release branch', branch)

          params = {
            'api.token': token,
            'transactions[0][type]': 'description',
            'transactions[0][value]': description,
            'transactions[1][type]': 'comment',
            'transactions[1][value]': f'Available in: TestFlight Wikipedia {version} ({build})',
          }

          if existing:
            params['objectIdentifier'] = existing['phid']
          else:
            params['transactions[2][type]'] = 'title'
            params['transactions[2][value]'] = title
            params['transactions[3][type]'] = 'projects.add'
            params['transactions[3][value][0]'] = PROJECT

          result = conduit('maniphest.edit', params)

          if result.get('error_code'):
            # The branch and the build already exist by this point, so a green
            # run here would hide a hotfix with no task to track it.
            print(f"::error::Failed to write the hotfix task for {version}: {result.get('error_info')}")
            print(f"::error::{branch} is built and tagged as betas/{build}. Create a task titled '{title}' by hand before submitting.")
            exit(1)

          print(f"✓ {'Updated' if existing else 'Created'} '{title}' (branch={branch}, build={build})")
          EOF

      # When Xcode Cloud fails, the lane saves its log bundles here; the
      # errors themselves are already annotations on this run.
      - name: Attach Xcode Cloud logs
        if: failure() && env.XCODE_CLOUD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xcode-cloud-logs-${{ github.run_id }}
          path: xcode-cloud-logs/
          if-no-files-found: ignore
          retention-days: 14
