name: V2 Cut Hotfix Branch

# Cuts a hotfix branch from the release that is currently in the App Store.
#
# This exists because the base commit is the easy thing to get wrong, and
# getting it wrong means shipping unreleased work to everyone. There is no
# base-tag input on purpose: the only correct base is the highest releases/
# tag, and an override is exactly the lever that would let a rushed hotfix
# be cut from the wrong place.
#
# After this runs you cherry-pick onto the branch yourself, with -x, then
# dispatch V2 Deploy Hotfix.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYYY.MM.DD) for the hotfix. Must be later than the release it is cut from.'
        required: true
        type: string

permissions:
  contents: write

# Serialize, so two people reacting to the same incident cannot both create a
# branch and race each other's pushes.
concurrency:
  group: v2-cut-hotfix
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest

    steps:
      # Fail in seconds if the secret is missing rather than after the checkout.
      - name: Check bot token is available
        env:
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          if [ -z "$APPS_BOT_TOKEN" ]; then
            echo "::error::APPS_BOT_TOKEN is not available to this run. The branch could not be pushed."
            exit 1
          fi
          echo "APPS_BOT_TOKEN is present"

      # fetch-depth: 0 for the full tag list; blob:none keeps it a partial
      # clone, since nothing here reads file contents.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the base release and validate
        id: base
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::Version '$VERSION' is not YYYY.MM.DD."
            exit 1
          fi

          BASE_TAG=$(git tag --list 'releases/*' --sort=-version:refname | head -1)
          if [ -z "$BASE_TAG" ]; then
            echo "::error::No releases/* tag exists, so there is no shipped release to patch."
            exit 1
          fi

          SHA=$(git rev-parse "refs/tags/$BASE_TAG")
          BASE_VERSION="${BASE_TAG#releases/}"

          # Printed before anything is created, because a wrong base is the
          # failure this workflow exists to prevent and the log is where you
          # would notice it.
          echo "Base release : $BASE_TAG"
          echo "Commit       : $SHA"
          echo "Committed    : $(git log -1 --format=%ci "$SHA")"
          echo "Subject      : $(git log -1 --format=%s "$SHA")"
          echo "Cutting      : hotfix/$VERSION"

          # App Store versions have to increase, and a hotfix that cannot be
          # submitted is worth catching now rather than after it is built.
          if [[ ! "$VERSION" > "$BASE_VERSION" ]]; then
            echo "::error::Version $VERSION is not later than $BASE_VERSION, the release it would be cut from. The App Store will not accept it."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/hotfix/$VERSION" >/dev/null 2>&1; then
            echo "::error::hotfix/$VERSION already exists. Delete it, or dispatch V2 Deploy Hotfix if you meant to build it."
            exit 1
          fi

          # One at a time, same rule as release candidates - two open hotfix
          # branches means it is ambiguous which one is being shipped.
          OTHERS=$(git ls-remote --heads origin 'refs/heads/hotfix/*' | sed 's|.*refs/heads/||' | tr '\n' ' ')
          if [ -n "$OTHERS" ]; then
            echo "::error::A hotfix branch is already open: $OTHERS. Finish and delete it before cutting another."
            exit 1
          fi

          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT

      - name: Create and push the hotfix branch
        env:
          VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ steps.base.outputs.sha }}
          BASE_TAG: ${{ steps.base.outputs.base_tag }}
          APPS_BOT_TOKEN: ${{ secrets.APPS_BOT_TOKEN }}
        run: |
          # Pushed as wmf-apps-ci like every other automated write here. The -c
          # clears the AUTHORIZATION header actions/checkout leaves configured
          # for github.com, so the URL's credentials are the only ones in play.
          git -c http.https://github.com/.extraheader= push \
            https://x-access-token:${APPS_BOT_TOKEN}@github.com/${{ github.repository }} \
            "$SHA:refs/heads/hotfix/$VERSION"

          echo "::notice::Cut hotfix/$VERSION from $BASE_TAG ($SHA)"
          echo
          echo "Next - work on a branch and open a PR into the hotfix branch,"
          echo "do not push to it directly:"
          echo
          echo "  git fetch origin"
          echo "  git checkout -b fix/T12345/short-description --no-track origin/hotfix/$VERSION"
          echo "                              # --no-track matters: without it the new branch is set"
          echo "                              # to track hotfix/$VERSION, and a bare git push then"
          echo "                              # pushes your work straight onto the hotfix branch"
          echo "                              # instead of creating a branch of its own"
          echo
          echo "  # if the fix is already on main, pick it across with -x:"
          echo "  git cherry-pick -x <sha>    # -x records which commit this came from, which is how"
          echo "                              # wrap up tells that main already has the fix (so it"
          echo "                              # opens no pointless merge-back PR) and whether an"
          echo "                              # in-flight release candidate is missing it"
          echo
          echo "  # if the fix is new - written against the released code rather than"
          echo "  # picked from main - just commit it here. Wrap up will open a PR to"
          echo "  # carry it back to main, since that is the only way main gets it."
          echo
          echo "  git push -u origin fix/T12345/short-description"
          echo
          echo "  then open a PR targeting hotfix/$VERSION and merge it."
          echo "  Name the working branch anything except hotfix/* - that prefix is"
          echo "  what the one-hotfix-at-a-time check looks at."
          echo
          echo "Then dispatch V2 Deploy Hotfix with version $VERSION."
