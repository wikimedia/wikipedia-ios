name: Unit test scheme
description: Run one scheme's unit tests with xcodebuild and report its coverage.

inputs:
  scheme:
    description: Scheme to test (Wikipedia, WMFComponents or WMFData).
    required: true
  destination:
    description: xcodebuild destination, from the prepare-simulator action.
    required: true
  compilation-cache:
    description: '"true" to build with Xcode''s compilation cache turned on.'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Test ${{ inputs.scheme }} scheme
      shell: bash
      env:
        SCHEME: ${{ inputs.scheme }}
        DESTINATION: ${{ inputs.destination }}
        CACHE_SETTING: ${{ inputs.compilation-cache == 'true' && 'COMPILATION_CACHE_ENABLE_CACHING=YES' || '' }}
      # ARCHS=arm64 and ONLY_ACTIVE_ARCH=YES: the runners and the simulator are arm64.
      # Under the Wikipedia scheme's custom "Test" configuration, Swift packages
      # (which have no such configuration) otherwise build an x86_64 slice as well,
      # which is never run and would also be stored in the compilation cache.
      # Set on the command line, so local Xcode builds are unaffected. From #6389.
      # EXPERIMENT: the same "Test" configuration also compiles the Swift packages with
      # release optimisation (-O, whole-module), which is slow to build. The flags below
      # build everything unoptimised for tests (no change to #if DEBUG paths), and skip
      # the index store, which only the editor reads.
      run: |
        echo "Running scheme: ${SCHEME} on ${DESTINATION}"
        xcodebuild test \
          -scheme "${SCHEME}" \
          -project Wikipedia.xcodeproj \
          -onlyUsePackageVersionsFromResolvedFile \
          -destination "${DESTINATION}" \
          -resultBundlePath "${SCHEME}_TestResults" \
          ${CACHE_SETTING} \
          ARCHS=arm64 \
          ONLY_ACTIVE_ARCH=YES \
          SWIFT_OPTIMIZATION_LEVEL=-Onone \
          SWIFT_COMPILATION_MODE=singlefile \
          GCC_OPTIMIZATION_LEVEL=0 \
          COMPILER_INDEX_STORE_ENABLE=NO \
          | xcpretty
        EXIT_CODE=${PIPESTATUS[0]}
        if [ "$EXIT_CODE" -ne 0 ]; then
          exit "$EXIT_CODE"
        fi

    - name: Coverage summary
      uses: ./.github/actions/coverage-summary
      with:
        artifact-name: ${{ inputs.scheme }}-coverage
        coverage-json-path: ${{ inputs.scheme }}_coverage.json
        result-bundle-path: ${{ inputs.scheme }}_TestResults.xcresult
        scheme: ${{ inputs.scheme }}
        workflow-file: run_unit_tests.yml
