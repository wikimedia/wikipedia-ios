name: Alpha release notes
description: >-
  Work out the TestFlight "What to Test" notes for an Alpha build, and the
  Phabricator tasks to tell it is out. Shared by both build paths in
  V2 Deploy Alpha (GitHub runner and Xcode Cloud).

inputs:
  sha:
    description: The commit the build was made from.
    required: true
  version:
    description: Marketing version of the build (YYYY.MM.DD).
    required: true
  build:
    description: Build number of the build.
    required: true
  github-token:
    description: Token for reading pull request bodies.
    required: true

outputs:
  phab_task_urls:
    description: Comma separated Phabricator task URLs from PRs that are new since the previous Alpha.
    value: ${{ steps.phab.outputs.phab_task_urls }}
  what_to_test_path:
    description: File holding the What to Test notes.
    value: /tmp/what_to_test.txt

runs:
  using: composite
  steps:
    # All PRs since the last release tag go into the What to Test notes.
    - name: Find new PRs since last release
      id: prs
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: |
        python3 << 'EOF'
        import subprocess
        import re
        import os

        result = subprocess.run(
          ['git', 'tag', '--list', 'releases/*', '--sort=-version:refname'],
          capture_output=True, text=True
        )
        tags = result.stdout.strip().split('\n')
        last_release_tag = next((t for t in tags if t), None)

        if not last_release_tag:
          print("No release tag found, skipping PR lookup")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write("pr_numbers=\n")
          exit(0)

        print(f"Last release tag: {last_release_tag}")

        result = subprocess.run(
          ['git', 'log', '--oneline', f"{last_release_tag}..{os.environ['SHA']}"],
          capture_output=True, text=True
        )
        commits = result.stdout.strip().split('\n')

        pr_numbers = []
        for commit in commits:
          # Matches both merge-commit PRs ("Merge pull request #123")
          # and squash-merge PRs ("Fix campaign modal (#123)")
          match = re.search(r'Merge pull request #(\d+)', commit) or re.search(r'\(#(\d+)\)\s*$', commit)
          if match:
            pr_numbers.append(match.group(1))

        print(f"Found PRs since last release: {pr_numbers}")

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
          f.write(f"pr_numbers={','.join(pr_numbers)}\n")
          f.write(f"last_release_tag={last_release_tag}\n")
        EOF

    # PRs since the previous Alpha get a Phabricator comment. "Previous" is
    # the nearest alphas/ tag behind the built commit, not the highest tag:
    # on the Xcode Cloud path the build's own tag is already pushed by the
    # time this runs, and the highest tag would be that one.
    - name: Find new PRs since last alpha
      id: new_prs
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: |
        python3 << 'EOF'
        import subprocess
        import re
        import os

        sha = os.environ['SHA']
        result = subprocess.run(
          ['git', 'describe', '--tags', '--match', 'alphas/*', '--abbrev=0', f'{sha}^'],
          capture_output=True, text=True
        )
        last_alpha_tag = result.stdout.strip() if result.returncode == 0 else None

        if not last_alpha_tag:
          print("No earlier alpha tag found, skipping new PR lookup")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write("new_pr_numbers=\n")
          exit(0)

        print(f"Last alpha tag: {last_alpha_tag}")

        result = subprocess.run(
          ['git', 'log', '--oneline', f'{last_alpha_tag}..{sha}'],
          capture_output=True, text=True
        )
        commits = result.stdout.strip().split('\n')

        pr_numbers = []
        for commit in commits:
          # Matches both merge-commit PRs ("Merge pull request #123")
          # and squash-merge PRs ("Fix campaign modal (#123)")
          match = re.search(r'Merge pull request #(\d+)', commit) or re.search(r'\(#(\d+)\)\s*$', commit)
          if match:
            pr_numbers.append(match.group(1))

        print(f"Found PRs since last alpha: {pr_numbers}")

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
          f.write(f"new_pr_numbers={','.join(pr_numbers)}\n")
        EOF

    # - All PRs since last release -> What to Test notes
    # - New PRs since last alpha -> Phabricator commenting
    - name: Fetch Phabricator tasks from PRs
      id: phab
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        ALL_PR_NUMBERS: ${{ steps.prs.outputs.pr_numbers }}
        NEW_PR_NUMBERS: ${{ steps.new_prs.outputs.new_pr_numbers }}
      run: |
        python3 << 'EOF'
        import urllib.request
        import urllib.error
        import json
        import re
        import os

        all_pr_numbers_str = os.environ.get('ALL_PR_NUMBERS', '')
        new_pr_numbers_str = os.environ.get('NEW_PR_NUMBERS', '')
        repo = os.environ['REPO']
        token = os.environ['GH_TOKEN']

        def fetch_phab_tasks(pr_numbers):
          phab_tasks = []
          for pr_num in pr_numbers:
            url = f"https://api.github.com/repos/{repo}/pulls/{pr_num}"
            req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
            body = ''
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req) as resp:
                  body = json.loads(resp.read()).get('body') or ''
                break
              except urllib.error.HTTPError as e:
                if e.code == 504 and attempt < 2:
                  print(f"PR #{pr_num}: 504 timeout, retrying ({attempt + 1}/3)...")
                  import time
                  time.sleep(5)
                else:
                  print(f"Could not fetch PR #{pr_num}: {e}")
                  break

            # Accept the task however the author wrote it: a full URL, a URL
            # with no scheme, or a bare task ID. All three turn up in practice,
            # and a near-miss used to drop the task silently - the task would be
            # missing from the What to Test notes and would never get its
            # "Available in: TestFlight Wikipedia Alpha" comment. Normalised to
            # canonical URLs so everything downstream is unchanged. "N/A" still
            # matches nothing, so deliberate opt-outs keep working.
            #
            # The separator has to stay \s - authors often list several tasks
            # one per line, and restricting it to spaces and tabs silently keeps
            # only the first.
            phab_section = re.findall(
              r'\*{0,2}Phabricator:\*{0,2}\s*((?:(?:https?://)?(?:phabricator\.wikimedia\.org/)?T\d+[\s,]*)+)',
              body, re.IGNORECASE
            )
            for section in phab_section:
              # IGNORECASE to match the outer pattern - otherwise a lowercase
              # t12345 matches there and then yields nothing here. Digits only,
              # so the URL is canonical whatever case was written.
              ids = re.findall(r'T(\d+)', section, re.IGNORECASE)
              phab_tasks.extend(f'https://phabricator.wikimedia.org/T{i}' for i in ids)

          return list(dict.fromkeys(phab_tasks))

        # All tasks since last release → What to Test notes
        if all_pr_numbers_str:
          all_pr_numbers = [p for p in all_pr_numbers_str.split(',') if p]
          all_tasks = fetch_phab_tasks(all_pr_numbers)
          print(f"All Phabricator tasks (since last release): {all_tasks}")
          with open('/tmp/phab_tasks.txt', 'w') as f:
            f.write('\n'.join(f'• {t}' for t in all_tasks))
        else:
          print("No PRs since last release")
          open('/tmp/phab_tasks.txt', 'w').close()
          all_tasks = []

        # New tasks since last alpha → for Phabricator commenting
        if new_pr_numbers_str:
          new_pr_list = [p for p in new_pr_numbers_str.split(',') if p]
          new_tasks = fetch_phab_tasks(new_pr_list)
          print(f"New Phabricator tasks (since last alpha): {new_tasks}")
        else:
          print("No new PRs since last alpha, skipping Phabricator commenting")
          new_tasks = []

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
          f.write(f"phab_task_urls={','.join(new_tasks)}\n")
        EOF

    - name: Write TestFlight notes
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD: ${{ inputs.build }}
        LAST_RELEASE_TAG: ${{ steps.prs.outputs.last_release_tag }}
      run: |
        PHAB_TASKS=$(cat /tmp/phab_tasks.txt 2>/dev/null || echo "No Phabricator tasks found")

        cat > /tmp/what_to_test.txt << EOF
        Build: $VERSION ($BUILD)

        Changes since $LAST_RELEASE_TAG:
        $PHAB_TASKS
        EOF

        cat /tmp/what_to_test.txt
