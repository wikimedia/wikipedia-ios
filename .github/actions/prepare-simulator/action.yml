name: Prepare simulator
description: Warm CoreSimulator and expose the shared xcodebuild simulator destination.

inputs:
  ios-version:
    description: iOS simulator runtime version.
    required: true
  simulator-name:
    description: iOS simulator device name.
    required: true

outputs:
  destination:
    description: xcodebuild destination for the selected simulator.
    value: ${{ steps.destination.outputs.destination }}

runs:
  using: composite
  steps:
    - name: List available simulators
      shell: bash
      run: |
        xcrun simctl list devices available

    - name: Boot simulator and set xcodebuild destination
      id: destination
      shell: bash
      env:
        IOS_VERSION: ${{ inputs.ios-version }}
        SIMULATOR_NAME: ${{ inputs.simulator-name }}
      run: |
        RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
        UDID="$(xcrun simctl list devices available -j \
          | jq -r --arg runtime "${RUNTIME}" --arg name "${SIMULATOR_NAME}" \
            '.devices[$runtime][]? | select(.name == $name) | .udid' \
          | head -n 1)"

        if [ -n "${UDID}" ]; then
          # Boot before testing so the first UI test does not pay for a cold boot inside
          # Xcode's app launch timeout.
          echo "Booting ${SIMULATOR_NAME} iOS ${IOS_VERSION} (${UDID})"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          DESTINATION="platform=iOS Simulator,id=${UDID}"
        else
          echo "No ${SIMULATOR_NAME} simulator found for ${RUNTIME}; xcodebuild will boot one by name."
          DESTINATION="platform=iOS Simulator,name=${SIMULATOR_NAME},OS=${IOS_VERSION}"
        fi

        echo "destination=${DESTINATION}" >> "$GITHUB_OUTPUT"
        echo "Using simulator destination: ${DESTINATION}"
