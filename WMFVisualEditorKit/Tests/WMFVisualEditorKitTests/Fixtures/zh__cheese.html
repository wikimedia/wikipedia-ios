<p id="mwAw"><b id="mwBA">乳<span typeof="mw:LanguageVariant" data-mw-variant='{"disabled":{"t":""}}' id="mwBQ"></span>酪</b>可以指：</p>
<ul id="mwBg"><li id="mwBw">由乳酸菌發酵而產生的奶製品，可以指：
<ul id="mwCA"><li id="mwCQ"><a rel="mw:WikiLink" href="./乾酪" title="乾酪" id="mwCg">乾酪</a>，常溫下通常為固體。</li>
<li id="mwCw"><a rel="mw:WikiLink" href="./酸奶" title="酸奶" id="mwDA">酸奶</a>，香港稱為乳<span typeof="mw:LanguageVariant" data-mw-variant='{"disabled":{"t":""}}' id="mwDQ"></span>酪。常溫下通常為液體（台灣稱為優<span typeof="mw:LanguageVariant" data-mw-variant='{"disabled":{"t":""}}' id="mwDg"></span>酪乳）或半凝固狀態（台灣稱為優<span typeof="mw:LanguageVariant" data-mw-variant='{"disabled":{"t":""}}' id="mwDw"></span>格）。</li></ul></li>
<li id="mwEA"><a rel="mw:WikiLink" href="./黄油" title="黄油" id="mwEQ">黄油</a>，中華民國國家標準第2877號曾經稱為乳<span typeof="mw:LanguageVariant" data-mw-variant='{"disabled":{"t":""}}' id="mwEg"></span>酪。</li></ul>
